name: Check Kotlin Multiplatform

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - feature/student-dashboard-kmp
      - kmp-migration
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Compile shared and Android code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compile Android KMP target
        run: gradle :composeApp:compileDebugKotlinAndroid --stacktrace

  ios:
    name: Compile iOS framework
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compile iOS simulator framework
        run: gradle :composeApp:linkDebugFrameworkIosSimulatorArm64 --stacktrace
