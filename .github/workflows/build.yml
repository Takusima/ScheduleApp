name: Build APK

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Apply UI fixes
        run: python3 tools/apply_ui_fixes.py

      - name: Prepare release signing
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
            export RELEASE_KEYSTORE_PATH="$RUNNER_TEMP/release.keystore"
            echo "RELEASE_KEYSTORE_PATH=$RELEASE_KEYSTORE_PATH" >> "$GITHUB_ENV"
            echo "RELEASE_KEYSTORE_PASSWORD=$RELEASE_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "RELEASE_KEY_ALIAS=$RELEASE_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "RELEASE_KEY_PASSWORD=$RELEASE_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "Release signing key found. Release APK will use the private release key."
          else
            echo "Release signing secrets are not configured yet. Building with the existing debug signing fallback."
          fi

      - name: Build Release APK
        run: |
          gradle clean assembleRelease --stacktrace

      - name: Check APK
        run: |
          ls -lh app/build/outputs/apk/release/
          file app/build/outputs/apk/release/app-release.apk

      - name: Verify APK
        run: |
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -n 1)
          echo "Using Android Build Tools: $BUILD_TOOLS"
          "$BUILD_TOOLS/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk ScheduleApp-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScheduleApp-release
          path: ScheduleApp-release.apk
          if-no-files-found: error

      - name: Build 0.1 APK from legacy commit
        env:
          V01_COMMIT: b3c3d7687cac80e7081b78667a6a80d83fdee605
        run: |
          set -e
          V01_DIR="$RUNNER_TEMP/scheduleapp-0.1"

          # actions/checkout is shallow, so fetch the exact legacy commit first.
          git fetch --no-tags origin "$V01_COMMIT"

          git worktree add --detach "$V01_DIR" "$V01_COMMIT"
          gradle -p "$V01_DIR" clean assembleRelease --stacktrace
          cp "$V01_DIR/app/build/outputs/apk/release/app-release.apk" "$RUNNER_TEMP/ScheduleApp-0.1.apk"
          test -s "$RUNNER_TEMP/ScheduleApp-0.1.apk"
          git worktree remove "$V01_DIR" --force

      - name: Publish versioned GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          # The 0.1 APK is built from the exact legacy commit (#171).
          # The Release tag itself is created on the current main commit so
          # the GitHub Actions token never attempts to push a ref containing
          # a workflow file without the separate `workflows` permission.

          # Create 0.1 on first publication. If it already exists, keep it.
          set +e
          gh release create release-0.1 "$RUNNER_TEMP/ScheduleApp-0.1.apk" \
            --target "$GITHUB_SHA" \
            --title "ScheduleApp 0.1" \
            --notes "Legacy stable APK. Built from commit b3c3d7687cac80e7081b78667a6a80d83fdee605 (release #171)." \
            2>"$RUNNER_TEMP/release-0.1.err"
          STATUS=$?
          set -e
          if [ "$STATUS" -ne 0 ]; then
            if grep -Eqi "already exists|already_exists|already present|already a release" "$RUNNER_TEMP/release-0.1.err"; then
              echo "release-0.1 already exists; leaving it unchanged."
            else
              cat "$RUNNER_TEMP/release-0.1.err"
              exit "$STATUS"
            fi
          fi

          # Create 0.2 on first publication. If it already exists, keep it.
          set +e
          gh release create release-0.2 ScheduleApp-release.apk \
            --target "$GITHUB_SHA" \
            --title "ScheduleApp 0.2" \
            --notes-file CHANGELOG.md \
            --latest \
            2>"$RUNNER_TEMP/release-0.2.err"
          STATUS=$?
          set -e
          if [ "$STATUS" -ne 0 ]; then
            if grep -Eqi "already exists|already_exists|already present|already a release" "$RUNNER_TEMP/release-0.2.err"; then
              echo "release-0.2 already exists; leaving it unchanged."
            else
              cat "$RUNNER_TEMP/release-0.2.err"
              exit "$STATUS"
            fi
          fi
