name: Build APK

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Apply UI fixes
        run: python3 tools/apply_ui_fixes.py

      - name: Prepare release signing
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
            export RELEASE_KEYSTORE_PATH="$RUNNER_TEMP/release.keystore"
            echo "RELEASE_KEYSTORE_PATH=$RELEASE_KEYSTORE_PATH" >> "$GITHUB_ENV"
            echo "RELEASE_KEYSTORE_PASSWORD=$RELEASE_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "RELEASE_KEY_ALIAS=$RELEASE_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "RELEASE_KEY_PASSWORD=$RELEASE_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "Release signing key found. Release APK will use the private release key."
          else
            echo "Release signing secrets are not configured yet. Building with the existing debug signing fallback."
          fi

      - name: Build Release APK
        run: |
          gradle clean assembleRelease --stacktrace

      - name: Check APK
        run: |
          ls -lh app/build/outputs/apk/release/
          file app/build/outputs/apk/release/app-release.apk

      - name: Verify APK
        run: |
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -n 1)
          echo "Using Android Build Tools: $BUILD_TOOLS"
          "$BUILD_TOOLS/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk ScheduleApp-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScheduleApp-release
          path: ScheduleApp-release.apk
          if-no-files-found: error

      - name: Publish versioned GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          V01_COMMIT: b3c3d7687cac80e7081b78667a6a80d83fdee605
        run: |
          set -e

          # Keep only the two supported release versions.
          # 0.1 is the stable release built from commit #171.
          # 0.2 is the current build from main.
          OLD_APK="$RUNNER_TEMP/ScheduleApp-0.1.apk"
          curl -L --fail --retry 3 \
            -o "$OLD_APK" \
            "https://github.com/Takusima/ScheduleApp/releases/download/release-171/ScheduleApp-release.apk"

          for release in $(gh release list --limit 100 --json tagName --jq '.[].tagName'); do
            if [ "$release" != "release-0.1" ] && [ "$release" != "release-0.2" ]; then
              gh release delete "$release" --yes --cleanup-tag || true
            fi
          done

          if gh release view release-0.1 >/dev/null 2>&1; then
            gh release delete release-0.1 --yes --cleanup-tag || true
          fi
          gh release create release-0.1 "$OLD_APK" \
            --target "$V01_COMMIT" \
            --title "ScheduleApp 0.1" \
            --notes-file CHANGELOG.md

          if gh release view release-0.2 >/dev/null 2>&1; then
            gh release delete release-0.2 --yes --cleanup-tag || true
          fi
          gh release create release-0.2 ScheduleApp-release.apk \
            --title "ScheduleApp 0.2" \
            --notes-file CHANGELOG.md \
            --latest