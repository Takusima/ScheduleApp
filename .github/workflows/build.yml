name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Release APK
        run: gradle assembleRelease --stacktrace

      - name: Find Android Build Tools
        id: build-tools
        run: |
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          echo "path=$BUILD_TOOLS" >> "$GITHUB_OUTPUT"
          echo "Using Build Tools: $BUILD_TOOLS"

      - name: Generate signing key
        run: |
          keytool -genkeypair \
            -v \
            -keystore release-key.jks \
            -alias scheduleapp \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass scheduleapp \
            -keypass scheduleapp \
            -dname "CN=ScheduleApp, OU=App, O=Taku, L=Germany, ST=Hesse, C=DE"

      - name: Align APK
        run: |
          "${{ steps.build-tools.outputs.path }}/zipalign" \
            -v -p 4 \
            app/build/outputs/apk/release/app-release-unsigned.apk \
            app-release-aligned.apk

      - name: Sign APK
        run: |
          "${{ steps.build-tools.outputs.path }}/apksigner" sign \
            --ks release-key.jks \
            --ks-pass pass:scheduleapp \
            --key-pass pass:scheduleapp \
            --out ScheduleApp-release.apk \
            app-release-aligned.apk

      - name: Verify APK
        run: |
          "${{ steps.build-tools.outputs.path }}/apksigner" verify \
            --verbose \
            --print-certs \
            ScheduleApp-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ScheduleApp-release
          path: ScheduleApp-release.apk
