name: Build APK

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build unsigned Release APK
        run: |
          gradle assembleRelease --stacktrace

      - name: Install Android SDK Build Tools
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "build-tools;35.0.0"

      - name: Create signing key
        run: |
          keytool -genkeypair \
            -v \
            -keystore scheduleapp-release.jks \
            -alias scheduleapp \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass scheduleapp \
            -keypass scheduleapp \
            -dname "CN=ScheduleApp, OU=Taku, O=ScheduleApp, L=Germany, ST=Hesse, C=DE"

      - name: Align APK
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" \
            -f -v 4 \
            app/build/outputs/apk/release/app-release-unsigned.apk \
            app-release-aligned.apk

      - name: Sign APK
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks scheduleapp-release.jks \
            --ks-pass pass:scheduleapp \
            --key-pass pass:scheduleapp \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out ScheduleApp-release.apk \
            app-release-aligned.apk

      - name: Verify APK
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify \
            --verbose \
            --print-certs \
            ScheduleApp-release.apk

      - name: Check APK
        run: |
          ls -lh ScheduleApp-release.apk
          file ScheduleApp-release.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: ScheduleApp-release
          path: ScheduleApp-release.apk
          if-no-files-found: error
