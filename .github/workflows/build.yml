name: Build APK

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Apply UI fixes
        run: python3 tools/apply_ui_fixes.py

      - name: Prepare release signing
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
            export RELEASE_KEYSTORE_PATH="$RUNNER_TEMP/release.keystore"
            echo "RELEASE_KEYSTORE_PATH=$RELEASE_KEYSTORE_PATH" >> "$GITHUB_ENV"
            echo "RELEASE_KEYSTORE_PASSWORD=$RELEASE_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "RELEASE_KEY_ALIAS=$RELEASE_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "RELEASE_KEY_PASSWORD=$RELEASE_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "Release signing key found. Release APK will use the private release key."
          else
            echo "Release signing secrets are not configured yet. Building with the existing debug signing fallback."
          fi

      - name: Build Release APK
        run: |
          gradle clean assembleRelease --stacktrace

      - name: Check APK
        run: |
          ls -lh app/build/outputs/apk/release/
          file app/build/outputs/apk/release/app-release.apk

      - name: Verify APK
        run: |
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -n 1)
          echo "Using Android Build Tools: $BUILD_TOOLS"
          "$BUILD_TOOLS/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk ScheduleApp-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScheduleApp-release
          path: ScheduleApp-release.apk
          if-no-files-found: error

      - name: Build 0.1 APK from legacy commit
        env:
          V01_COMMIT: b3c3d7687cac80e7081b78667a6a80d83fdee605
        run: |
          set -e
          V01_DIR="$RUNNER_TEMP/scheduleapp-0.1"

          # actions/checkout is shallow, so fetch the exact legacy commit first.
          git fetch --no-tags origin "$V01_COMMIT"

          git worktree add --detach "$V01_DIR" "$V01_COMMIT"
          gradle -p "$V01_DIR" clean assembleRelease --stacktrace
          cp "$V01_DIR/app/build/outputs/apk/release/app-release.apk" "$RUNNER_TEMP/ScheduleApp-0.1.apk"
          test -s "$RUNNER_TEMP/ScheduleApp-0.1.apk"
          git worktree remove "$V01_DIR" --force

      - name: Publish versioned GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          V01_COMMIT: b3c3d7687cac80e7081b78667a6a80d83fdee605
        run: |
          set -e

          # Do not call `gh release list` here: the Actions integration can
          # build/push repository content but may reject the releases GET API.
          # Instead, use git tags as the idempotency check.

          # 0.1 must point exactly to the original stable commit (#171).
          if ! git ls-remote --exit-code --refs origin "refs/tags/release-0.1" >/dev/null 2>&1; then
            git push origin "$V01_COMMIT:refs/tags/release-0.1"
          fi

          # With the fixed tag in place, create the 0.1 Release.
          # The first successful publication creates it; later runs keep it unchanged.
          if git ls-remote --exit-code --refs origin "refs/tags/release-0.1" >/dev/null 2>&1; then
            if ! git show-ref --verify --quiet "refs/remotes/origin/release-0.1"; then
              git fetch --no-tags origin "refs/tags/release-0.1:refs/remotes/origin/release-0.1" || true
            fi
          fi
          gh release create release-0.1 "$RUNNER_TEMP/ScheduleApp-0.1.apk" \
            --title "ScheduleApp 0.1" \
            --notes-file CHANGELOG.md || echo "release-0.1 already exists; leaving it unchanged."

          # 0.2 points to the current main commit. Create its tag once.
          if ! git ls-remote --exit-code --refs origin "refs/tags/release-0.2" >/dev/null 2>&1; then
            git push origin "HEAD:refs/tags/release-0.2"
          fi

          # Create the 0.2 Release.
          gh release create release-0.2 ScheduleApp-release.apk \
            --title "ScheduleApp 0.2" \
            --notes-file CHANGELOG.md \
            --latest || echo "release-0.2 already exists; leaving it unchanged."
