name: Build preview APK

on:
  push:
    branches:
      - feature/polish-reminders-schedule-storage

permissions:
  contents: read

jobs:
  build:
    name: Build preview APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        run: gradle clean assembleRelease --stacktrace
      - name: Verify APK exists
        run: test -s app/build/outputs/apk/release/app-release.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ScheduleApp-preview
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
