name: Kotlin Multiplatform Android Check

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - kmp-migration
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-kmp:
    name: Android KMP compile and APK build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compile KMP Android target
        run: gradle :composeApp:compileDebugKotlinAndroid --stacktrace

      - name: Build existing Android app
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: ScheduleApp-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
