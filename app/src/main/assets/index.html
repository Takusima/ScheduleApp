<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0d12">
<title>Расписание</title>

<script src="./xlsx.full.min.js"></script>

<style>
:root{
    --bg:#0b0d12;
    --card:#141821;
    --card2:#1a1f2a;
    --text:#f5f7fb;
    --muted:#9098a8;
    --accent:#8b7cff;
    --accent2:#aa9fff;
    --line:#272d38;
    --ok:#61d7a4;
    --error:#ff6b6b;
}

*{box-sizing:border-box}

html,body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
    background:var(--bg);
    color:var(--text);
    font-family:Arial,sans-serif;
}

body{padding:18px}

h1{
    margin:0;
    font-size:26px;
}

.subtitle{
    color:var(--muted);
    margin-top:6px;
    font-size:14px;
}

.status{
    margin-top:16px;
    padding:12px 14px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:12px;
    font-size:14px;
}

.status.ok{border-color:var(--ok)}
.status.error{border-color:var(--error)}

.section{margin-top:18px}

.section-title{
    font-size:16px;
    font-weight:bold;
    margin-bottom:10px;
}

.groups{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:9px;
}

button{
    border:0;
    border-radius:11px;
    padding:12px 10px;
    background:var(--accent);
    color:white;
    font-size:14px;
    font-weight:bold;
    min-height:44px;
}

button:active{opacity:.75}

button.secondary{
    background:var(--card2);
    border:1px solid var(--line);
}

button.selected{
    background:var(--accent2);
}

.empty{
    padding:20px;
    text-align:center;
    color:var(--muted);
    background:var(--card);
    border-radius:12px;
    border:1px solid var(--line);
}

.day{
    margin-top:16px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    overflow:hidden;
}

.day-title{
    padding:13px 14px;
    background:var(--card2);
    font-weight:bold;
}

.lesson{
    padding:12px 14px;
    border-top:1px solid var(--line);
}

.lesson-time{
    font-weight:bold;
    color:var(--accent2);
}

.lesson-name{
    margin-top:4px;
    line-height:1.4;
}

.lesson-room{
    margin-top:5px;
    color:var(--muted);
    font-size:13px;
}

.toolbar{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-top:16px;
}

.debug{
    margin-top:16px;
    padding:12px;
    background:#080a0f;
    border:1px solid var(--line);
    border-radius:10px;
    color:var(--muted);
    font-size:12px;
    white-space:pre-wrap;
    word-break:break-word;
}

.hidden{display:none}
</style>
</head>

<body>

<h1>Расписание</h1>
<div class="subtitle">Учебное расписание</div>

<div id="status" class="status">
    Запуск…
</div>

<div class="toolbar">
    <button onclick="syncNow()">Обновить</button>
    <button class="secondary" onclick="openSource()">Источник</button>
</div>

<div class="section">
    <div class="section-title">Группы</div>

    <div id="groups" class="groups">
        <div class="empty">Загрузка групп…</div>
    </div>
</div>

<div class="section">

    <div class="section-title" id="scheduleTitle">
        Расписание
    </div>

    <div id="schedule">
        <div class="empty">
            Выберите группу
        </div>
    </div>

</div>

<div id="debug" class="debug hidden"></div>

<script>

/* =========================================================
   НАСТРОЙКИ
========================================================= */

const AUTO_UPDATE_MINUTES = 10;


/* =========================================================
   СОСТОЯНИЕ
========================================================= */

let files = [];
let workbooks = [];
let groups = [];
let groupColumns = new Map();
let selectedGroup = null;
let schedule = [];
let syncRunning = false;


/* =========================================================
   DOM
========================================================= */

const statusEl =
    document.getElementById("status");

const groupsEl =
    document.getElementById("groups");

const scheduleEl =
    document.getElementById("schedule");

const titleEl =
    document.getElementById("scheduleTitle");

const debugEl =
    document.getElementById("debug");


/* =========================================================
   STATUS
========================================================= */

function setStatus(
    text,
    loading=false,
    error=false
){

    statusEl.textContent = text;

    statusEl.classList.remove("ok");
    statusEl.classList.remove("error");

    if(error){
        statusEl.classList.add("error");
    }else if(!loading){
        statusEl.classList.add("ok");
    }

}


/* =========================================================
   DEBUG
========================================================= */

function showDebug(text){

    debugEl.classList.remove("hidden");
    debugEl.textContent = text;

}


/* =========================================================
   NORMALIZE
========================================================= */

function clean(value){

    if(
        value === null ||
        value === undefined
    ){
        return "";
    }

    return String(value)
        .replace(/\u00a0/g," ")
        .replace(/\r/g," ")
        .replace(/\n/g," ")
        .replace(/\s+/g," ")
        .trim();

}


/* =========================================================
   EXCEL CELL
========================================================= */

function columnName(number){

    let result = "";

    while(number > 0){

        const remainder =
            (number - 1) % 26;

        result =
            String.fromCharCode(
                65 + remainder
            ) + result;

        number =
            Math.floor(
                (number - 1) / 26
            );

    }

    return result;

}


function cellAddress(row,column){

    return (
        columnName(column + 1) +
        String(row + 1)
    );

}


function cellValue(sheet,row,column){

    const address =
        cellAddress(row,column);

    const cell =
        sheet[address];

    if(!cell){
        return "";
    }

    if(
        cell.w !== undefined &&
        cell.w !== null
    ){
        return clean(cell.w);
    }

    if(
        cell.v !== undefined &&
        cell.v !== null
    ){
        return clean(cell.v);
    }

    return "";

}


/* =========================================================
   MERGED CELLS
========================================================= */

function getMergeOwner(
    sheet,
    row,
    column
){

    const merges =
        sheet["!merges"] || [];

    for(const merge of merges){

        if(
            row >= merge.s.r &&
            row <= merge.e.r &&
            column >= merge.s.c &&
            column <= merge.e.c
        ){

            return {
                row:merge.s.r,
                column:merge.s.c
            };

        }

    }

    return null;

}


function mergedCellValue(
    sheet,
    row,
    column
){

    const owner =
        getMergeOwner(
            sheet,
            row,
            column
        );

    if(owner){

        return cellValue(
            sheet,
            owner.row,
            owner.column
        );

    }

    return cellValue(
        sheet,
        row,
        column
    );

}


/* =========================================================
   РАЗМЕР EXCEL
========================================================= */

function getSheetSize(sheet){

    if(!sheet["!ref"]){
        return {
            rows:0,
            columns:0
        };
    }

    const range =
        XLSX.utils.decode_range(
            sheet["!ref"]
        );

    return {
        rows:
            range.e.r -
            range.s.r +
            1,

        columns:
            range.e.c -
            range.s.c +
            1
    };

}


/* =========================================================
   ПОИСК ГРУПП
========================================================= */

function findGroupsInSheet(
    sheet
){

    const result = [];

    const size =
        getSheetSize(sheet);

    /*
     * В реальном файле группы находятся
     * во второй строке.
     *
     * Ищем НЕ по regex.
     *
     * Ищем структуру:
     *
     * каб | ГРУППА
     *
     * То есть сначала находим "каб",
     * после чего смотрим соседние ячейки.
     */

    const headerRow = 1;

    for(
        let column=0;
        column<size.columns;
        column++
    ){

        const value =
            mergedCellValue(
                sheet,
                headerRow,
                column
            );

        if(
            clean(value).toLowerCase()
            !== "каб"
        ){
            continue;
        }

        /*
         * Сначала проверяем следующую колонку.
         */

        for(
            let offset=1;
            offset<=3;
            offset++
        ){

            const groupColumn =
                column + offset;

            if(
                groupColumn >=
                size.columns
            ){
                break;
            }

            const group =
                mergedCellValue(
                    sheet,
                    headerRow,
                    groupColumn
                );

            const name =
                clean(group);

            if(!name){
                continue;
            }

            if(
                name.toLowerCase() ===
                "каб"
            ){
                continue;
            }

            /*
             * Отсекаем заголовки верхнего уровня.
             * Но НЕ используем regex для определения
             * группы.
             */

            if(name.length > 40){
                continue;
            }

            /*
             * Проверяем, что это действительно
             * заголовок группы, а не случайный текст.
             *
             * В расписании группа должна иметь
             * данные ниже заголовка.
             */

            let hasData = false;

            for(
                let r=3;
                r<Math.min(size.rows,12);
                r++
            ){

                const test =
                    mergedCellValue(
                        sheet,
                        r,
                        groupColumn
                    );

                if(clean(test)){
                    hasData = true;
                    break;
                }

            }

            if(!hasData){
                continue;
            }

            if(
                !result.some(
                    x =>
                        x.name === name
                )
            ){

                result.push({
                    name:name,
                    column:groupColumn,
                    roomColumn:column
                });

            }

            break;

        }

    }

    return result;

}


/* =========================================================
   ПОЛУЧЕНИЕ ДНЯ
========================================================= */

function isDay(value){

    const text =
        clean(value);

    return /^(ПН|ВТ|СР|ЧТ|ПТ|СБ|ВС)\s+\d{1,2}\.\d{1,2}/i
        .test(text);

}


/* =========================================================
   РАСПОЗНАВАНИЕ ВРЕМЕНИ
========================================================= */

function isTime(value){

    const text =
        clean(value);

    if(!text){
        return false;
    }

    return (
        /^\d{1,2}[:.]\d{2}/.test(text)
    );

}


/* =========================================================
   РАСПИСАНИЕ
========================================================= */

function parseGroupSchedule(
    sheet,
    groupInfo
){

    const result = [];

    const size =
        getSheetSize(sheet);

    let currentDay = "";

    for(
        let row=0;
        row<size.rows;
        row++
    ){

        const day =
            mergedCellValue(
                sheet,
                row,
                0
            );

        if(isDay(day)){
            currentDay = day;
        }

        if(!currentDay){
            continue;
        }

        const lesson =
            mergedCellValue(
                sheet,
                row,
                groupInfo.column
            );

        if(!lesson){
            continue;
        }

        const normalizedLesson =
            clean(lesson);

        if(!normalizedLesson){
            continue;
        }

        if(
            normalizedLesson.toLowerCase()
            === "каб"
        ){
            continue;
        }

        const time =
            mergedCellValue(
                sheet,
                row,
                1
            );

        const room =
            mergedCellValue(
                sheet,
                row,
                groupInfo.roomColumn
            );

        /*
         * Пропускаем строки, которые не являются
         * занятиями.
         */

        if(
            !time &&
            !lesson
        ){
            continue;
        }

        result.push({
            day:currentDay,
            time:clean(time),
            lesson:normalizedLesson,
            room:clean(room)
        });

    }

    return result;

}


/* =========================================================
   ОТКРЫТИЕ XLSX
========================================================= */

function parseFile(
    file
){

    if(
        typeof XLSX ===
        "undefined"
    ){

        throw new Error(
            "SheetJS не загружен"
        );

    }

    if(
        !file ||
        !file.data
    ){

        throw new Error(
            "Получен пустой XLSX"
        );

    }

    const binary =
        atob(file.data);

    const bytes =
        new Uint8Array(
            binary.length
        );

    for(
        let i=0;
        i<binary.length;
        i++
    ){

        bytes[i] =
            binary.charCodeAt(i);

    }

    /*
     * Проверяем сигнатуру ZIP/XLSX.
     */

    if(
        bytes.length < 4 ||
        bytes[0] !== 0x50 ||
        bytes[1] !== 0x4b
    ){

        throw new Error(
            "Файл не похож на XLSX/ZIP"
        );

    }

    const workbook =
        XLSX.read(
            bytes,
            {
                type:"array",
                cellDates:false,
                cellNF:false,
                cellText:true
            }
        );

    if(
        !workbook.SheetNames ||
        !workbook.SheetNames.length
    ){

        throw new Error(
            "В XLSX нет листов"
        );

    }

    return workbook;

}


/* =========================================================
   ПОСТРОЕНИЕ ВСЕХ ДАННЫХ
========================================================= */

function buildData(){

    workbooks = [];
    groups = [];
    groupColumns.clear();

    let filesOK = 0;
    let totalSheets = 0;
    let lectureSheets = 0;

    const debugLines = [];

    debugLines.push(
        "SheetJS: " +
        (
            typeof XLSX !==
            "undefined"
            ? "OK"
            : "ОШИБКА"
        )
    );

    debugLines.push(
        "Файлов получено: " +
        files.length
    );

    for(const file of files){

        try{

            const workbook =
                parseFile(file);

            filesOK++;

            debugLines.push(
                "\nФайл: " +
                file.name
            );

            debugLines.push(
                "Листы: " +
                workbook.SheetNames.join(", ")
            );

            for(
                const sheetName
                of workbook.SheetNames
            ){

                totalSheets++;

                const sheet =
                    workbook.Sheets[
                        sheetName
                    ];

                const size =
                    getSheetSize(sheet);

                debugLines.push(
                    "Лист " +
                    sheetName +
                    ": " +
                    size.rows +
                    " x " +
                    size.columns
                );

                /*
                 * Нам нужен именно Лекции.
                 */
                const normalizedSheetName = clean(sheetName).toLowerCase().replace(/ё/g,"е").replace(/ /g,"");

                if(
                    normalizedSheetName !== "лекции" &&
                    !normalizedSheetName.includes("лекци")
                ){
                    continue;
                }

                lectureSheets++;

                const found =
                    findGroupsInSheet(
                        sheet
                    );

                debugLines.push(
                    "Групп на листе: " +
                    found.length
                );

                for(
                    const info
                    of found
                ){

                    if(
                        !groupColumns.has(
                            info.name
                        )
                    ){

                        groups.push(
                            info.name
                        );

                        groupColumns.set(
                            info.name,
                            info
                        );

                    }

                }

                workbooks.push({
                    file:file,
                    sheet:sheet,
                    sheetName:sheetName
                });

            }

        }catch(error){

            debugLines.push(
                "\nОШИБКА ФАЙЛА " +
                file.name +
                ":\n" +
                (
                    error.stack ||
                    error.message ||
                    String(error)
                )
            );

        }

    }

    groups.sort(
        (a,b)=>
            a.localeCompare(
                b,
                "ru",
                {
                    numeric:true,
                    sensitivity:"base"
                }
            )
    );

    debugLines.push(
        "\nИТОГО:"
    );

    debugLines.push(
        "Успешных файлов: " +
        filesOK
    );

    debugLines.push(
        "Всего листов: " +
        totalSheets
    );

    debugLines.push(
        "Листов Лекции: " +
        lectureSheets
    );

    debugLines.push(
        "Групп найдено: " +
        groups.length
    );

    /*
     * Показываем первые найденные группы
     * и реальные колонки.
     */

    for(
        const group of groups
    ){

        const info =
            groupColumns.get(
                group
            );

        debugLines.push(
            group +
            " -> " +
            columnName(
                info.column + 1
            ) +
            " / каб " +
            columnName(
                info.roomColumn + 1
            )
        );

    }

    showDebug(
        debugLines.join("\n")
    );

    if(!workbooks.length){

        throw new Error(
            "Не найден лист «Лекции»"
        );

    }

    if(!groups.length){

        throw new Error(
            "На листе «Лекции» не найдены группы"
        );

    }

}


/* =========================================================
   ОТОБРАЖЕНИЕ ГРУПП
========================================================= */

function renderGroups(){

    groupsEl.innerHTML = "";

    if(!groups.length){

        groupsEl.innerHTML =
            '<div class="empty">' +
            'Группы не найдены' +
            '</div>';

        return;

    }

    for(
        const group
        of groups
    ){

        const button =
            document.createElement(
                "button"
            );

        button.textContent =
            group;

        if(
            group ===
            selectedGroup
        ){

            button.classList.add(
                "selected"
            );

        }

        button.onclick =
            function(){

                selectedGroup =
                    group;

                renderGroups();

                loadSelectedSchedule();

            };

        groupsEl.appendChild(
            button
        );

    }

}


/* =========================================================
   РАСПИСАНИЕ ВЫБРАННОЙ ГРУППЫ
========================================================= */

function loadSelectedSchedule(){

    schedule = [];

    if(!selectedGroup){
        renderSchedule();
        return;
    }

    const groupInfo =
        groupColumns.get(
            selectedGroup
        );

    if(!groupInfo){

        renderSchedule();

        return;

    }

    for(
        const workbook
        of workbooks
    ){

        const data =
            parseGroupSchedule(
                workbook.sheet,
                groupInfo
            );

        schedule.push(
            ...data
        );

    }

    renderSchedule();

}


/* =========================================================
   ОТОБРАЖЕНИЕ РАСПИСАНИЯ
========================================================= */

function renderSchedule(){

    titleEl.textContent =
        selectedGroup
            ? "Расписание — " +
              selectedGroup
            : "Расписание";

    scheduleEl.innerHTML = "";

    if(!selectedGroup){

        scheduleEl.innerHTML =
            '<div class="empty">' +
            'Выберите группу' +
            '</div>';

        return;

    }

    if(!schedule.length){

        scheduleEl.innerHTML =
            '<div class="empty">' +
            'Расписание для группы «' +
            selectedGroup +
            '» не найдено.' +
            '</div>';

        return;

    }

    const days = [];

    for(
        const item
        of schedule
    ){

        if(
            !days.includes(
                item.day
            )
        ){

            days.push(
                item.day
            );

        }

    }

    for(
        const day
        of days
    ){

        const dayItems =
            schedule.filter(
                item =>
                    item.day === day
            );

        const dayEl =
            document.createElement(
                "div"
            );

        dayEl.className =
            "day";

        const dayTitle =
            document.createElement(
                "div"
            );

        dayTitle.className =
            "day-title";

        dayTitle.textContent =
            day;

        dayEl.appendChild(
            dayTitle
        );

        for(
            const item
            of dayItems
        ){

            const lesson =
                document.createElement(
                    "div"
                );

            lesson.className =
                "lesson";

            const time =
                document.createElement(
                    "div"
                );

            time.className =
                "lesson-time";

            time.textContent =
                item.time ||
                "Время не указано";

            const name =
                document.createElement(
                    "div"
                );

            name.className =
                "lesson-name";

            name.textContent =
                item.lesson;

            lesson.appendChild(
                time
            );

            lesson.appendChild(
                name
            );

            if(item.room){

                const room =
                    document.createElement(
                        "div"
                    );

                room.className =
                    "lesson-room";

                room.textContent =
                    "Кабинет: " +
                    item.room;

                lesson.appendChild(
                    room
                );

            }

            dayEl.appendChild(
                lesson
            );

        }

        scheduleEl.appendChild(
            dayEl
        );

    }

}


/* =========================================================
   ANDROID → JAVASCRIPT
========================================================= */

window.onNativeFiles =
    function(json){

        try{

            files =
                JSON.parse(json);

            syncRunning = false;

            if(
                !Array.isArray(files)
            ){

                throw new Error(
                    "Android вернул не массив файлов"
                );

            }

            if(!files.length){

                throw new Error(
                    "В ZIP нет XLSX-файлов"
                );

            }

            setStatus(
                "Получено файлов: " +
                files.length +
                ". Читаю Excel…",
                true
            );

            buildData();

            if(
                !selectedGroup ||
                !groups.includes(
                    selectedGroup
                )
            ){

                selectedGroup =
                    groups[0];

            }

            renderGroups();

            loadSelectedSchedule();

            setStatus(
                "Расписание загружено. Групп: " +
                groups.length
            );

        }catch(error){

            syncRunning = false;

            setStatus(
                "Ошибка Excel: " +
                (
                    error.message ||
                    error
                ),
                false,
                true
            );

            showDebug(
                "ОШИБКА:\n\n" +
                (
                    error.stack ||
                    error.message ||
                    String(error)
                )
            );

        }

    };


window.onNativeError =
    function(message){

        syncRunning = false;

        setStatus(
            message ||
            "Ошибка загрузки",
            false,
            true
        );

    };


/* =========================================================
   СИНХРОНИЗАЦИЯ
========================================================= */

function syncNow(){

    if(syncRunning){
        return;
    }

    syncRunning = true;

    setStatus(
        "Загружаю расписание…",
        true
    );

    try{

        if(
            typeof Android ===
            "undefined"
        ){

            throw new Error(
                "Android bridge недоступен"
            );

        }

        Android.sync();

    }catch(error){

        syncRunning = false;

        setStatus(
            "Ошибка: " +
            (
                error.message ||
                error
            ),
            false,
            true
        );

    }

}


/* =========================================================
   ИСТОЧНИК
========================================================= */

function openSource(){

    try{

        Android.openSource();

    }catch(error){

        alert(
            "Не удалось открыть источник"
        );

    }

}


/* =========================================================
   АВТООБНОВЛЕНИЕ
========================================================= */

setInterval(
    function(){

        if(
            document.visibilityState ===
            "visible"
        ){

            syncNow();

        }

    },
    AUTO_UPDATE_MINUTES *
    60 *
    1000
);


document.addEventListener(
    "visibilitychange",
    function(){

        if(
            document.visibilityState ===
            "visible"
        ){

            syncNow();

        }

    }
);


/* =========================================================
   СТАРТ
========================================================= */

renderGroups();

setStatus(
    "Проверяю расписание…",
    true
);

syncNow();

</script>
