<script>


/* =========================================================
   НАСТРОЙКИ
========================================================= */


const AUTO_UPDATE_MINUTES = 10;

const AUTO_UPDATE_MS =
    AUTO_UPDATE_MINUTES * 60 * 1000;


const state = {

    files: [],

    group:
        localStorage.getItem(
            "group"
        ) || "",

    date:
        localStorage.getItem(
            "date"
        ) || ""

};


let parsedCache = {};

let syncRunning = false;

let lastSyncTime =
    Number(
        localStorage.getItem(
            "lastSyncTime"
        ) || 0
    );



/* =========================================================
   СОХРАНЕНИЕ
========================================================= */


function saveState(){

    localStorage.setItem(
        "group",
        state.group
    );

    localStorage.setItem(
        "date",
        state.date
    );

}



/* =========================================================
   СТАТУС
========================================================= */


function setStatus(
    text,
    loading = false,
    error = false
){

    document.getElementById(
        "status"
    ).textContent = text;


    const dot =
        document.getElementById(
            "dot"
        );


    dot.classList.toggle(
        "loading",
        loading
    );


    dot.classList.toggle(
        "error",
        error
    );

}



/* =========================================================
   БЕЗОПАСНЫЙ HTML
========================================================= */


function esc(value){

    return String(
        value ?? ""
    ).replace(
        /[&<>"']/g,
        function(char){

            return {

                "&":"&amp;",
                "<":"&lt;",
                ">":"&gt;",
                '"':"&quot;",
                "'":"&#39;"

            }[char];

        }
    );

}



/* =========================================================
   ДАТЫ
========================================================= */


function pad(n){

    return String(n)
        .padStart(
            2,
            "0"
        );

}


function isoDate(
    year,
    month,
    day
){

    return (
        year +
        "-" +
        pad(month) +
        "-" +
        pad(day)
    );

}


function formatDate(
    date
){

    return new Intl.DateTimeFormat(
        "ru-RU",
        {
            day:"numeric",
            month:"long"
        }
    ).format(
        new Date(
            date + "T12:00:00"
        )
    );

}


function weekdayName(
    date
){

    return new Intl.DateTimeFormat(
        "ru-RU",
        {
            weekday:"long"
        }
    ).format(
        new Date(
            date + "T12:00:00"
        )
    );

}



/* =========================================================
   НАЗВАНИЯ ДНЕЙ
========================================================= */


const DAY_MAP = {

    "ПН":1,
    "ПОНЕДЕЛЬНИК":1,

    "ВТ":2,
    "ВТОРНИК":2,

    "СР":3,
    "СРЕДА":3,

    "ЧТ":4,
    "ЧЕТВЕРГ":4,

    "ПТ":5,
    "ПЯТНИЦА":5,

    "СБ":6,
    "СУББОТА":6,

    "ВС":0,
    "ВОСКРЕСЕНЬЕ":0

};



/* =========================================================
   РАЗБОР СТРОКИ ДНЯ
   Например:
   ПН 14.09
========================================================= */


function parseDayCell(
    value
){

    const text =
        String(
            value ?? ""
        )
        .trim()
        .replace(
            /\s+/g,
            " "
        );


    if(!text){
        return null;
    }


    const match =
        text.match(
            /^(ПН|ВТ|СР|ЧТ|ПТ|СБ|ВС|ПОНЕДЕЛЬНИК|ВТОРНИК|СРЕДА|ЧЕТВЕРГ|ПЯТНИЦА|СУББОТА|ВОСКРЕСЕНЬЕ)\s+(\d{1,2})[./-](\d{1,2})$/i
        );


    if(!match){
        return null;
    }


    const dayName =
        match[1].toUpperCase();


    const day =
        Number(match[2]);


    const month =
        Number(match[3]);


    const year =
        2026;


    return {

        dayName,

        day,

        month,

        date:
            isoDate(
                year,
                month,
                day
            )

    };

}



/* =========================================================
   ПОИСК ДАТ В EXCEL
========================================================= */


function findScheduleDates(
    sheets
){

    const dates = [];


    for(
        const sheet of sheets
    ){

        const rows =
            sheet.data;


        for(
            let r = 0;
            r < rows.length;
            r++
        ){

            const firstCell =
                rows[r][0];


            const parsed =
                parseDayCell(
                    firstCell
                );


            if(
                parsed &&
                !dates.some(
                    x =>
                        x.date ===
                        parsed.date
                )
            ){

                dates.push(
                    parsed
                );

            }

        }

    }


    dates.sort(
        (a,b) =>
            a.date.localeCompare(
                b.date
            )
    );


    return dates;

}



/* =========================================================
   НАСТРОЙКА ДАТЫ ПОСЛЕ ЗАГРУЗКИ
========================================================= */


function ensureValidDate(){

    const allDates =
        getAllScheduleDates();


    if(!allDates.length){
        return;
    }


    const todayDate =
        new Date();


    const todayIso =
        todayDate
            .toISOString()
            .slice(
                0,
                10
            );


    if(
        state.date &&
        allDates.includes(
            state.date
        )
    ){

        return;

    }


    const futureOrToday =
        allDates.find(
            x =>
                x >= todayIso
        );


    if(futureOrToday){

        state.date =
            futureOrToday;

    }else{

        state.date =
            allDates[0];

    }


    saveState();

}



/* =========================================================
   XLSX
========================================================= */


function parseFile(
    file
){

    if(
        parsedCache[file.name]
    ){

        return parsedCache[
            file.name
        ];

    }


    try{

        const binary =
            atob(
                file.data
            );


        const bytes =
            new Uint8Array(
                binary.length
            );


        for(
            let i = 0;
            i < binary.length;
            i++
        ){

            bytes[i] =
                binary.charCodeAt(i);

        }


        const workbook =
            XLSX.read(
                bytes,
                {
                    type:"array",
                    cellDates:true
                }
            );


        const sheets =
            workbook.SheetNames.map(
                function(name){

                    return {

                        name:name,

                        data:
                            XLSX.utils.sheet_to_json(
                                workbook.Sheets[name],
                                {
                                    header:1,
                                    defval:""
                                }
                            )

                    };

                }
            );


        parsedCache[
            file.name
        ] = sheets;


        return sheets;

    }catch(error){

        console.error(
            "Ошибка чтения Excel:",
            error
        );


        return [];

    }

}



/* =========================================================
   ПОИСК ГРУПП
   ГРУППЫ БЕРУТСЯ НЕ ПО REGEX,
   А НЕПОСРЕДСТВЕННО ИЗ СТРОКИ 2.
========================================================= */


function findGroups(){

    const groups = [];

    const seen =
        new Set();


    for(
        const file of state.files
    ){

        const sheets =
            parseFile(file);


        for(
            const sheet of sheets
        ){

            const rows =
                sheet.data;


            /*
             * В твоём Excel:
             *
             * строка 2:
             *
             * каб | 10 м/с | каб | 11 м/с | ...
             *
             * Индексы JavaScript начинаются с 0,
             * поэтому это rows[1].
             */


            const header =
                rows[1];


            if(!header){
                continue;
            }


            for(
                let col = 0;
                col < header.length;
                col++
            ){

                let value =
                    String(
                        header[col] ?? ""
                    )
                    .replace(
                        /\s+/g,
                        " "
                    )
                    .trim();


                if(!value){
                    continue;
                }


                if(
                    value.toLowerCase() ===
                    "каб"
                ){

                    continue;

                }


                /*
                 * Важный момент:
                 *
                 * мы НЕ проверяем название
                 * регулярным выражением.
                 *
                 * Всё, что находится
                 * в строке заголовков
                 * между колонками "каб",
                 * считается группой.
                 */


                if(
                    value.length > 0 &&
                    value.length < 100
                ){

                    if(
                        !seen.has(value)
                    ){

                        seen.add(value);

                        groups.push({
                            name:value,
                            col:col,
                            sheet:sheet.name
                        });

                    }

                }

            }

        }

    }


    return groups;

}



/* =========================================================
   ВСЕ ДАТЫ
========================================================= */


function getAllScheduleDates(){

    const result =
        new Set();


    for(
        const file of state.files
    ){

        const sheets =
            parseFile(file);


        for(
            const sheet of sheets
        ){

            const dates =
                findScheduleDates(
                    [sheet]
                );


            dates.forEach(
                d =>
                    result.add(
                        d.date
                    )
            );

        }

    }


    return Array.from(
        result
    ).sort();

}



/* =========================================================
   ВЫБОР ФАЙЛА
========================================================= */


function getFileStartDate(
    name
){

    const text =
        String(
            name ?? ""
        );


    /*
     * 14.09.26
     */

    let m =
        text.match(
            /(\d{1,2})[.](\d{1,2})[.](\d{2,4})/
        );


    if(m){

        let year =
            Number(
                m[3]
            );


        if(year < 100){
            year += 2000;
        }


        return isoDate(
            year,
            Number(m[2]),
            Number(m[1])
        );

    }


    /*
     * 2026-09-14
     */

    m =
        text.match(
            /(20\d{2})[._-](\d{1,2})[._-](\d{1,2})/
        );


    if(m){

        return isoDate(
            Number(m[1]),
            Number(m[2]),
            Number(m[3])
        );

    }


    return "1900-01-01";

}



function chooseFile(
    date
){

    const sorted =
        [...state.files]
        .sort(
            function(a,b){

                return getFileStartDate(b.name)
                    .localeCompare(
                        getFileStartDate(a.name)
                    );

            }
        );


    /*
     * Сначала пытаемся найти файл,
     * который начинается до выбранной даты.
     */

    const suitable =
        sorted.find(
            file =>
                getFileStartDate(
                    file.name
                ) <= date
        );


    return (
        suitable ||
        sorted[sorted.length - 1] ||
        null
    );

}



/* =========================================================
   ПОИСК КОЛОНКИ ГРУППЫ
========================================================= */


function findGroupColumn(
    sheet,
    group
){

    const rows =
        sheet.data;


    const header =
        rows[1];


    if(!header){
        return -1;
    }


    for(
        let col = 0;
        col < header.length;
        col++
    ){

        const value =
            String(
                header[col] ?? ""
            )
            .replace(
                /\s+/g,
                " "
            )
            .trim();


        if(
            value === group
        ){

            return col;

        }

    }


    return -1;

}



/* =========================================================
   ИЗВЛЕЧЕНИЕ РАСПИСАНИЯ
========================================================= */


function extractSchedule(
    file,
    targetDate,
    group
){

    const sheets =
        parseFile(file);


    const result = [];


    for(
        const sheet of sheets
    ){

        const rows =
            sheet.data;


        const groupCol =
            findGroupColumn(
                sheet,
                group
            );


        if(
            groupCol < 0
        ){

            continue;

        }


        /*
         * В твоём Excel перед группой
         * всегда находится колонка "каб".
         *
         * Например:
         *
         * C = каб
         * D = 10 м/с
         *
         * Поэтому кабинет:
         *
         * groupCol - 1
         */


        const cabinetCol =
            groupCol > 0
                ? groupCol - 1
                : -1;


        let activeDate =
            null;


        for(
            let rowIndex = 0;
            rowIndex < rows.length;
            rowIndex++
        ){

            const row =
                rows[rowIndex];


            if(!row){
                continue;
            }


            /*
             * Проверяем первую колонку.
             *
             * Например:
             *
             * ПН 14.09
             */

            const parsedDay =
                parseDayCell(
                    row[0]
                );


            if(parsedDay){

                activeDate =
                    parsedDay.date;

                continue;

            }


            /*
             * Нас интересуют только строки
             * выбранного дня.
             */

            if(
                activeDate !==
                targetDate
            ){

                continue;

            }


            /*
             * В колонке B находится время.
             */

            const time =
                String(
                    row[1] ?? ""
                )
                .trim();


            /*
             * В колонке группы находится
             * название занятия.
             */

            const subject =
                String(
                    row[groupCol] ?? ""
                )
                .trim();


            if(
                !subject
            ){

                continue;

            }


            /*
             * Иногда в таблице могут быть
             * технические значения.
             */

            if(
                subject === "каб"
            ){

                continue;

            }


            const cabinet =
                cabinetCol >= 0
                    ? String(
                        row[cabinetCol] ?? ""
                    ).trim()
                    : "";


            result.push({

                time,

                subject,

                cabinet,

                sheet:sheet.name

            });

        }

    }


    return result;

}



/* =========================================================
   УДАЛЕНИЕ ДУБЛИКАТОВ
========================================================= */


function removeDuplicates(
    lessons
){

    const seen =
        new Set();


    return lessons.filter(
        lesson => {

            const key =
                [
                    lesson.time,
                    lesson.subject,
                    lesson.cabinet
                ].join(
                    "|"
                );


            if(
                seen.has(key)
            ){

                return false;

            }


            seen.add(key);

            return true;

        }
    );

}



/* =========================================================
   ГРУППЫ
========================================================= */


function fillGroups(){

    const select =
        document.getElementById(
            "group"
        );


    const groups =
        findGroups();


    console.log(
        "Найдено групп:",
        groups.length
    );


    console.log(
        "Группы:",
        groups.map(
            g =>
                g.name
        )
    );


    if(
        groups.length === 0
    ){

        select.innerHTML =
            `
            <option value="">
                Группы не найдены
            </option>
            `;


        setStatus(
            "Группы не найдены",
            false,
            true
        );


        return;

    }


    /*
     * Убираем возможные дубликаты
     */

    const names =
        Array.from(
            new Set(
                groups.map(
                    g =>
                        g.name
                )
            )
        );


    names.sort(
        function(a,b){

            return a.localeCompare(
                b,
                "ru",
                {
                    numeric:true,
                    sensitivity:"base"
                }
            );

        }
    );


    select.innerHTML =
        names.map(
            name =>
                `
                <option value="${esc(name)}">
                    ${esc(name)}
                </option>
                `
        ).join("");


    /*
     * Сохраняем старую группу,
     * если она всё ещё существует.
     */

    if(
        state.group &&
        names.includes(
            state.group
        )
    ){

        select.value =
            state.group;

    }else{

        state.group =
            names[0];

        select.value =
            state.group;

        saveState();

    }

}



/* =========================================================
   НЕДЕЛЯ
========================================================= */


function getWeekDates(
    centerDate
){

    const d =
        new Date(
            centerDate +
            "T12:00:00"
        );


    const day =
        d.getDay();


    const mondayOffset =
        day === 0
            ? -6
            : 1 - day;


    d.setDate(
        d.getDate() +
        mondayOffset
    );


    const result = [];


    for(
        let i = 0;
        i < 7;
        i++
    ){

        const x =
            new Date(d);


        x.setDate(
            d.getDate() +
            i
        );


        result.push(
            x.toISOString()
                .slice(
                    0,
                    10
                )
        );

    }


    return result;

}



/* =========================================================
   НЕДЕЛЬНЫЕ КНОПКИ
========================================================= */


function renderWeek(){

    const container =
        document.getElementById(
            "week"
        );


    container.innerHTML = "";


    if(!state.date){
        return;
    }


    getWeekDates(
        state.date
    ).forEach(
        date => {

            const button =
                document.createElement(
                    "button"
                );


            button.className =
                "chip";


            if(
                date ===
                state.date
            ){

                button.classList.add(
                    "active"
                );

            }


            const dateObj =
                new Date(
                    date +
                    "T12:00:00"
                );


            button.textContent =
                new Intl.DateTimeFormat(
                    "ru-RU",
                    {
                        weekday:"short",
                        day:"numeric"
                    }
                ).format(
                    dateObj
                );


            button.onclick =
                function(){

                    changeDate(
                        date
                    );

                };


            container.appendChild(
                button
            );

        }
    );

}



/* =========================================================
   ОТРИСОВКА
========================================================= */


function render(){

    const dateInput =
        document.getElementById(
            "date"
        );


    dateInput.value =
        state.date || "";


    renderWeek();


    const content =
        document.getElementById(
            "content"
        );


    content.innerHTML = "";


    if(
        !state.files.length
    ){

        content.innerHTML =
            `
            <div class="empty">
                Расписание ещё не загружено.
                <br><br>
                Нажми «Обновить».
            </div>
            `;


        return;

    }


    if(
        !state.group
    ){

        content.innerHTML =
            `
            <div class="empty">
                Выбери группу выше.
            </div>
            `;


        return;

    }


    if(
        !state.date
    ){

        content.innerHTML =
            `
            <div class="empty">
                Дата расписания не найдена.
            </div>
            `;


        return;

    }


    const file =
        chooseFile(
            state.date
        );


    if(!file){

        content.innerHTML =
            `
            <div class="empty">
                Файл расписания не найден.
            </div>
            `;


        return;

    }


    let lessons =
        extractSchedule(
            file,
            state.date,
            state.group
        );


    lessons =
        removeDuplicates(
            lessons
        );


    content.innerHTML =
        `
        <div class="day">

            ${esc(
                weekdayName(
                    state.date
                )
            )}

            <small>
                ${esc(
                    formatDate(
                        state.date
                    )
                )}
            </small>

        </div>
        `;


    if(
        !lessons.length
    ){

        content.innerHTML +=
            `
            <div class="empty">

                На этот день
                занятий нет.

                <br><br>

                Группа:
                <b>
                    ${esc(
                        state.group
                    )}
                </b>

            </div>
            `;


        return;

    }


    lessons.forEach(
        lesson => {

            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "lesson";


            div.innerHTML =
                `

                <div class="time">

                    ${esc(
                        lesson.time ||
                        "Время не указано"
                    )}

                </div>


                <div class="subject">

                    ${esc(
                        lesson.subject
                    )}

                </div>


                <div class="meta">


                    ${
                        lesson.cabinet
                            ?
                            `
                            <span class="pill">

                                Каб.
                                ${esc(
                                    lesson.cabinet
                                )}

                            </span>
                            `
                            :
                            ""
                    }


                    ${
                        lesson.sheet
                            ?
                            `
                            <span class="pill">

                                ${esc(
                                    lesson.sheet
                                )}

                            </span>
                            `
                            :
                            ""
                    }


                </div>

                `;


            content.appendChild(
                div
            );

        }
    );

}



/* =========================================================
   ИЗМЕНЕНИЕ ГРУППЫ
========================================================= */


function changeGroup(
    value
){

    state.group =
        value;


    saveState();

    render();

}



/* =========================================================
   ИЗМЕНЕНИЕ ДАТЫ
========================================================= */


function changeDate(
    value
){

    if(!value){
        return;
    }


    state.date =
        value;


    saveState();

    render();

}



/* =========================================================
   СЕГОДНЯ
========================================================= */


function today(){

    const now =
        new Date();


    state.date =
        now.toISOString()
            .slice(
                0,
                10
            );


    /*
     * Если сегодняшней даты нет
     * в расписании, render всё равно
     * покажет, что занятий нет.
     */

    saveState();

    render();

}



/* =========================================================
   ОБНОВЛЕНИЕ
========================================================= */


function manualSync(){

    if(syncRunning){
        return;
    }


    syncRunning = true;


    setStatus(
        "Обновляю расписание…",
        true
    );


    try{

        Android.sync();

    }catch(error){

        syncRunning = false;


        setStatus(
            "Ошибка обновления",
            false,
            true
        );

    }

}



/* =========================================================
   АВТОМАТИЧЕСКОЕ ОБНОВЛЕНИЕ
========================================================= */


function autoSync(){

    if(syncRunning){
        return;
    }


    syncRunning = true;


    setStatus(
        "Автоматически проверяю расписание…",
        true
    );


    try{

        Android.sync();

    }catch(error){

        syncRunning = false;


        setStatus(
            "Не удалось обновить расписание",
            false,
            true
        );

    }

}



/* =========================================================
   ЗАПУСК ТАЙМЕРА
========================================================= */


function startAutoUpdate(){

    setInterval(
        function(){

            autoSync();

        },
        AUTO_UPDATE_MS
    );

}



/* =========================================================
   ОБНОВЛЕНИЕ ПРИ ВОЗВРАЩЕНИИ
========================================================= */


document.addEventListener(
    "visibilitychange",
    function(){

        if(
            document.visibilityState ===
            "visible"
        ){

            const now =
                Date.now();


            if(
                now - lastSyncTime >=
                AUTO_UPDATE_MS
            ){

                autoSync();

            }

        }

    }
);



/* =========================================================
   ДАННЫЕ ОТ ANDROID
========================================================= */


window.onNativeFiles =
    function(json){

        try{

            const received =
                JSON.parse(
                    json
                );


            state.files =
                received.map(
                    function(item){

                        return {

                            name:
                                item.name,

                            data:
                                item.data

                        };

                    }
                );


            /*
             * После нового Excel
             * очищаем старый кэш.
             */

            parsedCache = {};


            /*
             * Определяем актуальную дату
             * из самого расписания.
             */

            ensureValidDate();


            /*
             * Заново получаем группы
             * из строки 2 Excel.
             */

            fillGroups();


            /*
             * Показываем расписание.
             */

            render();


            syncRunning = false;


            lastSyncTime =
                Date.now();


            localStorage.setItem(
                "lastSyncTime",
                String(
                    lastSyncTime
                )
            );


            setStatus(
                "Расписание обновлено • " +
                new Intl.DateTimeFormat(
                    "ru-RU",
                    {
                        hour:"2-digit",
                        minute:"2-digit"
                    }
                ).format(
                    new Date()
                )
            );


        }catch(error){

            console.error(
                "Ошибка обработки расписания:",
                error
            );


            syncRunning = false;


            setStatus(
                "Ошибка обработки расписания",
                false,
                true
            );

        }

    };



/* =========================================================
   ОШИБКА ANDROID
========================================================= */


window.onNativeError =
    function(message){

        syncRunning = false;


        setStatus(
            message ||
            "Ошибка обновления",
            false,
            true
        );


        /*
         * Не удаляем старое расписание.
         *
         * Если интернет пропал,
         * пользователь продолжает видеть
         * ранее загруженные данные.
         */

        render();

    };

/* =========================================================
   СТАРТ ПРИЛОЖЕНИЯ
========================================================= */


(function(){

    /*
     * Сначала показываем сохранённые данные.
     */

    render();


    /*
     * Сразу после запуска
     * проверяем новое расписание.
     */

    setStatus(
        "Проверяю расписание…",

    );


    try{

        Android.sync();

    }catch(error){

            "Ошибка запуска обновления",

        );

    }


    /*
     * Далее каждые 10 минут.
