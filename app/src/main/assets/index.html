<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0c12">
<title>Расписание</title>
<script src="./xlsx.full.min.js"></script>
<style>
:root{--bg:#090b10;--card:#1a1d2b;--card2:#202337;--field:#10121a;--line:#2c3040;--text:#f7f7fb;--muted:#9da1b2;--accent:#8b7cff;--accent2:#9b8cff;--ok:#61d7a4;--danger:#ff6673}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Arial,sans-serif}body{padding:26px 18px 96px;max-width:760px;margin:auto}button,select{font:inherit}h1{font-size:46px;line-height:1;margin:30px 0 12px;font-weight:800;letter-spacing:-1.5px}.subtitle{font-size:22px;line-height:1.2;color:var(--muted);max-width:560px}.source-dot{position:fixed;right:-12px;top:118px;width:78px;height:78px;border-radius:25px;background:#111522;border:1px solid #242938;display:flex;align-items:center;justify-content:center;font-size:34px;z-index:2}.card{margin-top:38px;padding:32px 36px 36px;border-radius:34px;background:linear-gradient(145deg,#242641,#1b1e31);border:1px solid #3a3d58;box-shadow:0 20px 55px rgba(0,0,0,.28)}.label{font-size:20px;color:var(--muted);margin:0 0 12px 2px}.field{position:relative;margin-bottom:28px}.select{width:100%;height:104px;border:1px solid #2b2e3c;border-radius:27px;background:var(--field);color:var(--text);padding:0 56px 0 36px;font-size:24px;outline:none;appearance:none}.field:after{content:'⌄';position:absolute;right:24px;bottom:30px;color:#ddd;font-size:30px;pointer-events:none}.actions{display:grid;grid-template-columns:1fr 1fr;gap:20px}.btn{height:104px;border:1px solid #282c38;border-radius:27px;background:#1a1e29;color:var(--text);font-size:22px;font-weight:800}.btn.primary{background:var(--accent);border-color:var(--accent)}.btn:active{transform:scale(.985);opacity:.82}.statusline{display:flex;align-items:center;gap:12px;margin:28px 4px 18px;color:var(--muted);font-size:22px}.statusdot{width:17px;height:17px;border-radius:50%;background:var(--ok);flex:none}.statusdot.error{background:var(--danger)}.days{display:flex;gap:14px;overflow-x:auto;padding:0 2px 8px;scrollbar-width:none}.days::-webkit-scrollbar{display:none}.daybtn{flex:0 0 auto;min-width:126px;height:86px;border-radius:24px;background:#151923;border:1px solid #292e3b;color:#9ca2b4;font-size:22px;font-weight:800}.daybtn.selected{background:var(--accent);color:#fff;border-color:var(--accent)}.schedulebox{margin-top:18px;border:1px dashed #303646;border-radius:30px;background:#141820;overflow:hidden}.dayheader{padding:22px 24px;font-size:23px;font-weight:800;background:#1b1f2b;border-bottom:1px solid var(--line)}.lesson{padding:21px 24px;border-bottom:1px solid var(--line)}.lesson:last-child{border-bottom:0}.time{font-size:20px;font-weight:800;color:var(--accent2)}.name{margin-top:7px;font-size:19px;line-height:1.4}.room{margin-top:7px;color:var(--muted);font-size:16px}.empty{padding:40px 22px;text-align:center;color:var(--muted);font-size:20px}.bottom{position:fixed;left:18px;right:18px;bottom:16px;max-width:724px;margin:auto;height:82px;background:#131720;border:1px solid #2c3040;border-radius:31px;display:grid;grid-template-columns:repeat(3,1fr);padding:8px;z-index:5}.nav{border:0;background:transparent;color:#9ca2b4;border-radius:24px;font-size:18px;font-weight:800}.nav.active{background:#1d2230;color:#fff}.debug{display:none;white-space:pre-wrap;margin-top:16px;padding:12px;color:#7f8597;font-size:11px}.meta{margin-top:9px;color:#73798a;font-size:13px;text-align:center}.hidden{display:none}@media(max-width:520px){body{padding:14px 16px 94px}h1{font-size:42px;margin-top:34px}.subtitle{font-size:20px}.source-dot{top:116px}.card{margin-top:38px;padding:28px 36px 34px;border-radius:32px}.select{height:106px;font-size:23px;padding-left:35px}.actions{gap:18px}.btn{height:106px;font-size:21px}.daybtn{min-width:128px;height:86px}.bottom{left:16px;right:16px}.nav{font-size:17px}}
</style>
</head>
<body>
<div class="source-dot" onclick="openSource()">↗</div>
<h1>Расписание</h1>
<div class="subtitle">Mail Облако • автоматическая<br>синхронизация</div>

<section class="card">
  <div class="label">Группа</div>
  <div class="field">
    <select id="groupSelect" class="select" onchange="selectGroup(this.value)">
      <option value="">Введите группу</option>
    </select>
  </div>

  <div class="label">Дата</div>
  <div class="field">
    <select id="dateSelect" class="select" onchange="selectDate(this.value)">
      <option value="">Выберите дату</option>
    </select>
  </div>

  <div class="actions">
    <button class="btn primary" onclick="syncNow()">↻<br>Обновить</button>
    <button class="btn" onclick="goToday()">Сегодня</button>
  </div>
</section>

<div class="statusline"><span id="statusDot" class="statusdot"></span><span id="status">Проверяю расписание…</span></div>
<div id="days" class="days"></div>
<div id="schedule" class="schedulebox"><div class="empty">Выбери группу выше.</div></div>
<div id="meta" class="meta"></div>
<div id="debug" class="debug"></div>

<nav class="bottom">
  <button class="nav active">Расписание</button>
  <button class="nav" onclick="goCalendar()">Календарь</button>
  <button class="nav" onclick="showSettings()">Настройки</button>
</nav>

<script>
const publicSource='https://cloud.mail.ru/public/vH1B/7LrFtqWqP';
let files=[],parsedDocuments=[],groups=[],schedule=[];
let selectedGroup='',selectedDate='',syncRunning=false;
const $=id=>document.getElementById(id);

function clean(v){return v==null?'':String(v).replace(/\u00a0/g,' ').replace(/\s+/g,' ').trim()}
function norm(v){return clean(v).toLowerCase().replace(/ё/g,'е').replace(/ /g,'')}
function isLectureSheet(v){const n=norm(v);return n==='лекции'||n.includes('лекци')}
function isGroupName(v){const x=clean(v);return !!x&&norm(x)!=='каб'&&x.length<=30&&/^\d{1,3}/.test(x)}
function isDay(v){return /^(ПН|ВТ|СР|ЧТ|ПТ|СБ|ВС)\s+\d{1,2}\.\d{1,2}(?:\.\d{2,4})?$/i.test(clean(v))}
function dateKey(v,fallback){const m=clean(v).match(/\b(\d{1,2})\.(\d{1,2})(?:\.(\d{2,4}))?\b/);if(!m)return fallback||0;let y=m[3]?+m[3]:new Date().getFullYear();if(y<100)y+=2000;return new Date(y,+m[2]-1,+m[1]).getTime()}
function fileDateKey(name){const m=clean(name).match(/(\d{1,2})[.\-_](\d{1,2})[.\-_](\d{2,4})/);if(!m)return 0;let y=+m[3];if(y<100)y+=2000;return new Date(y,+m[2]-1,+m[1]).getTime()}
function timeValue(v){const m=clean(v).replace(',', '.').replace(':','.').match(/^(\d{1,2})\.(\d{2})$/);return m? +m[1]*60 + +m[2] : 99999}
function setStatus(text,error=false){$('status').textContent=text;$('statusDot').classList.toggle('error',!!error)}
function debug(t){$('debug').textContent=t}

function parseXlsx(file){
  const b=atob(file.data),bytes=new Uint8Array(b.length);for(let i=0;i<b.length;i++)bytes[i]=b.charCodeAt(i);
  const wb=XLSX.read(bytes,{type:'array',cellDates:true});const out=[];
  for(const name of wb.SheetNames){const sh=wb.Sheets[name];out.push({name,rows:XLSX.utils.sheet_to_json(sh,{header:1,defval:'',raw:false}),merges:sh['!merges']||[]})}return out
}
function findGroups(sheet){
  const out=[];for(let r=0;r<Math.min(5,sheet.rows.length);r++){const row=sheet.rows[r]||[];for(let c=0;c<row.length;c++){const name=clean(row[c]);if(!isGroupName(name))continue;if(!out.some(x=>norm(x.name)===norm(name)))out.push({name,column:c,roomColumn:c-1})}}return out
}
function parseGroup(sheet,info,fileIndex){
  const out=[];let day='',dayIdx=fileIndex||0;const rows=sheet.rows;
  for(let r=0;r<rows.length;r++){
    const row=rows[r]||[],a=clean(row[0]);if(isDay(a)){day=a;dayIdx=r}
    if(!day)continue;const time=clean(row[1]);const lesson=clean(row[info.column]);const room=info.roomColumn>=0?clean(row[info.roomColumn]):'';
    if(!lesson||norm(lesson)==='каб')continue;
    out.push({day,time,lesson,room,dateKey:dateKey(day,dayIdx),row:r,fileIndex})
  }return out
}
function buildData(){
  groups=[];parsedDocuments=[];let lectureSheets=0;const logs=[];
  files.forEach((file,fileIndex)=>{try{for(const sheet of parseXlsx(file)){if(!isLectureSheet(sheet.name))continue;lectureSheets++;const found=findGroups(sheet);logs.push(file.name+' → '+sheet.name+': '+found.length+' групп');parsedDocuments.push({file,sheet,groups:found,fileDate:fileDateKey(file.name),fileIndex});for(const g of found)if(!groups.some(x=>norm(x.name)===norm(g.name)))groups.push({name:g.name})}}catch(e){logs.push(file.name+' → '+(e.message||e))}});
  groups.sort((a,b)=>a.name.localeCompare(b.name,'ru',{numeric:true,sensitivity:'base'}));
  debug('XLSX: '+files.length+'\nЛисты «Лекции»: '+lectureSheets+'\nГруппы: '+groups.length+'\n'+logs.join('\n'));
  renderGroups();
  if(!groups.length){setStatus(lectureSheets?'Группы не найдены':'Лист «Лекции» не найден',true);$('schedule').innerHTML='<div class="empty">Не удалось найти расписание.</div>';return}
  if(!selectedGroup||!groups.some(g=>norm(g.name)===norm(selectedGroup)))selectedGroup=groups[0].name;
  $('groupSelect').value=selectedGroup;loadSchedule();
}
function renderGroups(){const s=$('groupSelect');s.innerHTML='<option value="">Введите группу</option>'+groups.map(g=>'<option value="'+escapeHtml(g.name)+'">'+escapeHtml(g.name)+'</option>').join('')}
function escapeHtml(v){return clean(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function loadSchedule(){
  schedule=[];if(!selectedGroup){render();return}
  for(const d of parsedDocuments){const info=d.groups.find(x=>norm(x.name)===norm(selectedGroup));if(info)schedule.push(...parseGroup(d.sheet,info,d.fileIndex))}
  const unique=new Map();for(const x of schedule){const key=x.dateKey+'|'+x.time+'|'+x.lesson+'|'+x.room;if(!unique.has(key))unique.set(key,x)}schedule=[...unique.values()];
  schedule.sort((a,b)=>(a.dateKey-b.dateKey)||timeValue(a.time)-timeValue(b.time));
  const dates=[...new Map(schedule.map(x=>[x.dateKey,x.day])).entries()].sort((a,b)=>a[0]-b[0]);
  if(!dates.length){selectedDate='';render();return}
  if(!selectedDate||!dates.some(x=>String(x[0])===String(selectedDate))){const today=new Date();const todayStart=new Date(today.getFullYear(),today.getMonth(),today.getDate()).getTime();const exact=dates.find(x=>x[0]===todayStart);selectedDate=String(exact?exact[0]:dates[0][0])}
  renderDates(dates);render();
}
function renderDates(dates){
  $('dateSelect').innerHTML=dates.map(([k,d])=>'<option value="'+k+'">'+escapeHtml(formatDate(d))+'</option>').join('');$('dateSelect').value=String(selectedDate);
  $('days').innerHTML=dates.map(([k,d])=>'<button class="daybtn '+(String(k)===String(selectedDate)?'selected':'')+'" onclick="selectDate(\''+k+'\')">'+escapeHtml(shortDate(d))+'</button>').join('');
}
function formatDate(d){const m=clean(d).match(/\s(\d{1,2})\.(\d{1,2})/);if(!m)return d;return m[1].padStart(2,'0')+'.'+m[2].padStart(2,'0')+'.'+new Date().getFullYear()}
function shortDate(d){const m=clean(d).match(/^([А-ЯЁ]+)\s+(\d{1,2})\.(\d{1,2})/i);return m?m[1].toLowerCase()+', '+m[2]:d}
function selectGroup(v){selectedGroup=v;selectedDate='';loadSchedule()}
function selectDate(v){selectedDate=String(v);renderDates([...new Map(schedule.map(x=>[x.dateKey,x.day])).entries()].sort((a,b)=>a[0]-b[0]));render()}
function goToday(){const now=new Date();const k=new Date(now.getFullYear(),now.getMonth(),now.getDate()).getTime();const hit=schedule.find(x=>x.dateKey===k);if(hit)selectedDate=String(k);renderDates([...new Map(schedule.map(x=>[x.dateKey,x.day])).entries()].sort((a,b)=>a[0]-b[0]));render()}
function render(){
  if(!selectedGroup){$('schedule').innerHTML='<div class="empty">Выбери группу выше.</div>';return}
  const items=selectedDate?schedule.filter(x=>String(x.dateKey)===String(selectedDate)):schedule;
  $('schedule').innerHTML='';
  if(!items.length){$('schedule').innerHTML='<div class="empty">На выбранную дату пар нет.</div>';return}
  const title=document.createElement('div');title.className='dayheader';title.textContent=items[0].day;$('schedule').appendChild(title);
  for(const x of items){const el=document.createElement('div');el.className='lesson';el.innerHTML='<div class="time">'+escapeHtml(x.time||'Время не указано')+'</div><div class="name">'+escapeHtml(x.lesson)+'</div>'+(x.room?'<div class="room">Кабинет: '+escapeHtml(x.room)+'</div>':'');$('schedule').appendChild(el)}
  $('meta').textContent=selectedGroup+' • '+items.length+' занятий';
}
function syncNow(){if(syncRunning)return;syncRunning=true;setStatus('Обновляю расписание…');try{Android.sync()}catch(e){syncRunning=false;setStatus(e.message||'Ошибка',true)}}
function openSource(){try{Android.openSource()}catch(e){location.href=publicSource}}
function goCalendar(){alert('Календарь будет использовать те же сохранённые данные расписания.')}
function showSettings(){alert('Настройки: автоматическое обновление выполняется по воскресеньям, расписание хранится на устройстве для офлайн-работы.')}
window.onNativeFiles=function(json,status){try{files=JSON.parse(json);syncRunning=false;buildData();setStatus(status||'Расписание обновлено');}catch(e){syncRunning=false;setStatus('Ошибка обработки расписания',true);debug(e.stack||e)}}
window.onNativeError=function(msg){syncRunning=false;setStatus(msg||'Ошибка обновления',true)}
window.addEventListener('load',function(){try{Android.loadCached()}catch(e){setStatus('Нет сохранённого расписания',true)}setTimeout(function(){try{Android.sync()}catch(e){}},900)})
</script>
</body>
</html>
