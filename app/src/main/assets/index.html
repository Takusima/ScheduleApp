<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0d12">
<title>Расписание</title>

<script src="./xlsx.full.min.js"></script>

<style>
:root{
    --bg:#0b0d12;
    --card:#141821;
    --card2:#1a1f2a;
    --text:#f5f7fb;
    --muted:#9098a8;
    --accent:#8b7cff;
    --accent2:#aa9fff;
    --line:#272d38;
    --ok:#61d7a4;
    --error:#ff6b6b;
}

*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
    background:var(--bg);
    color:var(--text);
    font-family:Arial,sans-serif;
}

body{
    padding:18px;
}

h1{
    margin:0;
    font-size:26px;
}

.subtitle{
    color:var(--muted);
    margin-top:6px;
    font-size:14px;
}

.status{
    margin-top:16px;
    padding:12px 14px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:12px;
    font-size:14px;
}

.status.ok{
    border-color:var(--ok);
}

.status.error{
    border-color:var(--error);
}

.section{
    margin-top:18px;
}

.section-title{
    font-size:16px;
    font-weight:bold;
    margin-bottom:10px;
}

.groups{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:9px;
}

button{
    border:0;
    border-radius:11px;
    padding:12px 10px;
    background:var(--accent);
    color:white;
    font-size:14px;
    font-weight:bold;
    min-height:44px;
}

button:active{
    opacity:.75;
}

button.secondary{
    background:var(--card2);
    border:1px solid var(--line);
}

button.selected{
    background:var(--accent2);
}

.empty{
    padding:20px;
    text-align:center;
    color:var(--muted);
    background:var(--card);
    border-radius:12px;
    border:1px solid var(--line);
}

.day{
    margin-top:16px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    overflow:hidden;
}

.day-title{
    padding:13px 14px;
    background:var(--card2);
    font-weight:bold;
}

.lesson{
    padding:12px 14px;
    border-top:1px solid var(--line);
}

.lesson-time{
    font-weight:bold;
    color:var(--accent2);
}

.lesson-name{
    margin-top:4px;
    line-height:1.4;
}

.lesson-room{
    margin-top:5px;
    color:var(--muted);
    font-size:13px;
}

.toolbar{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-top:16px;
}

.debug{
    margin-top:16px;
    padding:12px;
    background:#080a0f;
    border:1px solid var(--line);
    border-radius:10px;
    color:var(--muted);
    font-size:12px;
    white-space:pre-wrap;
    word-break:break-word;
}

.hidden{
    display:none;
}
</style>
</head>

<body>

<h1>Расписание</h1>
<div class="subtitle">Учебное расписание</div>

<div id="status" class="status">
    Запуск…
</div>

<div class="toolbar">
    <button onclick="syncNow()">Обновить</button>
    <button class="secondary" onclick="openSource()">Источник</button>
</div>

<div class="section">
    <div class="section-title">Группы</div>
    <div id="groups" class="groups">
        <div class="empty">Загрузка групп…</div>
    </div>
</div>

<div class="section">
    <div class="section-title" id="scheduleTitle">
        Расписание
    </div>

    <div id="schedule">
        <div class="empty">
            Выберите группу
        </div>
    </div>
</div>

<div id="debug" class="debug hidden"></div>

<script>

const AUTO_UPDATE_MINUTES = 10;

let files = [];
let parsedDocuments = [];
let groups = [];
let selectedGroup = null;
let schedule = [];
let syncRunning = false;

const statusEl = document.getElementById("status");
const groupsEl = document.getElementById("groups");
const scheduleEl = document.getElementById("schedule");
const titleEl = document.getElementById("scheduleTitle");
const debugEl = document.getElementById("debug");


function setStatus(text, loading=false, error=false){
    statusEl.textContent = text;
    statusEl.classList.remove("ok");
    statusEl.classList.remove("error");

    if(error){
        statusEl.classList.add("error");
    }else if(!loading){
        statusEl.classList.add("ok");
    }
}


function debug(text){
    debugEl.classList.remove("hidden");
    debugEl.textContent = text;
}


function syncNow(){
    if(syncRunning){
        return;
    }

    syncRunning = true;
    setStatus("Загружаю расписание…", true);

    try{
        if(typeof Android === "undefined"){
            throw new Error("Android bridge недоступен");
        }

        Android.sync();

    }catch(e){
        syncRunning = false;
        setStatus(
            "Ошибка: " + (e.message || e),
            false,
            true
        );
    }
}


function openSource(){
    try{
        Android.openSource();
    }catch(e){
        alert("Не удалось открыть источник");
    }
}


/* =========================================================
   ОБЩИЕ ФУНКЦИИ
========================================================= */

function clean(value){
    if(value === null || value === undefined){
        return "";
    }

    return String(value)
        .replace(/\u00a0/g, " ")
        .replace(/\s+/g, " ")
        .trim();
}


function normalize(value){
    return clean(value)
        .toLowerCase()
        .replace(/ё/g, "е")
        .replace(/ /g, "");
}


function isLectureSheet(name){
    const n = normalize(name);

    return (
        n === "лекции" ||
        n.includes("лекци")
    );
}


function isGroupName(value){
    const v = clean(value);

    if(!v || normalize(v) === "каб"){
        return false;
    }

    if(v.length > 30){
        return false;
    }

    /*
     * Реальные названия групп в строке 2:
     * 10 м/с, 25(1) ф, 26-п ак,
     * 34 лаб, 10 класс и т.д.
     *
     * Начало с цифры — главный признак.
     */
    return /^\d{1,3}/.test(v);
}


function isDay(value){
    const v = clean(value);

    return /^(ПН|ВТ|СР|ЧТ|ПТ|СБ|ВС)\s+\d{1,2}\.\d{1,2}(?:\.\d{2,4})?$/i.test(v);
}


function isTime(value){
    const v = clean(value);

    return /^\d{1,2}[:.]\d{2}$/.test(v);
}


function dateKey(dayText, fallbackIndex){
    const v = clean(dayText);
    const m = v.match(/\b(\d{1,2})\.(\d{1,2})(?:\.(\d{2,4}))?\b/);

    if(!m){
        return fallbackIndex || 0;
    }

    let year = m[3] ? Number(m[3]) : 2000;

    if(year < 100){
        year += 2000;
    }

    return new Date(
        year,
        Number(m[2]) - 1,
        Number(m[1])
    ).getTime();
}


function fileDateKey(name){
    const v = clean(name);

    /*
     * Например:
     * расписание 14.09.26-19.09.26
     */
    const m = v.match(
        /(\d{1,2})[.\-_](\d{1,2})[.\-_](\d{2,4})/
    );

    if(!m){
        return 0;
    }

    let year = Number(m[3]);

    if(year < 100){
        year += 2000;
    }

    return new Date(
        year,
        Number(m[2]) - 1,
        Number(m[1])
    ).getTime();
}


/* =========================================================
   EXCEL
========================================================= */

function parseXlsx(file){

    if(typeof XLSX === "undefined"){
        throw new Error("SheetJS не загружен");
    }

    const binary = atob(file.data);

    const bytes = new Uint8Array(binary.length);

    for(let i = 0; i < binary.length; i++){
        bytes[i] = binary.charCodeAt(i);
    }

    const workbook = XLSX.read(
        bytes,
        {
            type: "array",
            cellDates: true
        }
    );

    const result = [];

    for(const sheetName of workbook.SheetNames){

        const sheet = workbook.Sheets[sheetName];

        const rows = XLSX.utils.sheet_to_json(
            sheet,
            {
                header: 1,
                defval: "",
                raw: false
            }
        );

        result.push({
            name: sheetName,
            rows: rows,
            merges: sheet["!merges"] || []
        });
    }

    return result;
}


/* =========================================================
   ПОИСК ГРУПП
========================================================= */

function findGroupsInSheet(sheet){

    const found = [];

    if(!sheet || !sheet.rows){
        return found;
    }

    /*
     * В реальном файле группы находятся в строке 2.
     * Формат:
     *
     * C = каб
     * D = 10 м/с
     * E = каб
     * F = 11 м/с
     * ...
     */
    const rows = sheet.rows;

    for(let r = 0; r < Math.min(4, rows.length); r++){

        const row = rows[r] || [];

        for(let c = 0; c < row.length; c++){

            const value = clean(row[c]);

            if(!isGroupName(value)){
                continue;
            }

            if(
                !found.some(
                    x => normalize(x.name) === normalize(value)
                )
            ){
                found.push({
                    name: value,
                    column: c,
                    roomColumn: c - 1
                });
            }
        }
    }

    return found;
}


/* =========================================================
   РАСПИСАНИЕ ОДНОЙ ГРУППЫ
========================================================= */

function parseGroupSchedule(sheet, groupInfo, fileIndex){

    const result = [];

    if(
        !sheet ||
        !sheet.rows ||
        !groupInfo ||
        groupInfo.column < 0
    ){
        return result;
    }

    const rows = sheet.rows;
    const groupColumn = groupInfo.column;
    const roomColumn = groupInfo.roomColumn;

    let currentDay = "";
    let dayIndex = fileIndex || 0;

    for(let r = 0; r < rows.length; r++){

        const row = rows[r] || [];

        /*
         * Колонка A содержит день только
         * в первой строке объединённого блока.
         * Поэтому запоминаем его.
         */
        const first = clean(row[0]);

        if(isDay(first)){
            currentDay = first;
            dayIndex = r;
        }

        if(!currentDay){
            continue;
        }

        /*
         * B — начало пары.
         */
        const time = clean(row[1]);

        /*
         * D/F/H/... — сама группа.
         */
        const lesson = clean(row[groupColumn]);

        /*
         * C/E/G/... — кабинет.
         */
        let room = "";

        if(roomColumn >= 0){
            room = clean(row[roomColumn]);
        }

        /*
         * Если строка полностью пустая — пропускаем.
         */
        if(!lesson){
            continue;
        }

        /*
         * Не показываем случайные служебные значения.
         */
        if(normalize(lesson) === "каб"){
            continue;
        }

        result.push({
            day: currentDay,
            time: time,
            lesson: lesson,
            room: room,
            dateKey: dateKey(currentDay, dayIndex),
            row: r
        });
    }

    return result;
}


/* =========================================================
   ПОСТРОЕНИЕ ДАННЫХ
========================================================= */

function buildData(){

    groups = [];
    parsedDocuments = [];

    let lectureSheets = 0;
    let debugLines = [];

    /*
     * Каждый скачанный XLSX обрабатываем отдельно.
     */
    files.forEach(function(file, fileIndex){

        try{

            const sheets = parseXlsx(file);

            let fileLectureSheets = 0;

            for(const sheet of sheets){

                if(!isLectureSheet(sheet.name)){
                    continue;
                }

                lectureSheets++;
                fileLectureSheets++;

                const found = findGroupsInSheet(sheet);

                debugLines.push(
                    file.name +
                    " → «" +
                    sheet.name +
                    "»: групп " +
                    found.length
                );

                parsedDocuments.push({
                    file: file,
                    fileIndex: fileIndex,
                    fileDate: fileDateKey(file.name),
                    sheet: sheet,
                    groups: found
                });

                for(const info of found){

                    if(
                        !groups.some(
                            x =>
                                normalize(x.name) ===
                                normalize(info.name)
                        )
                    ){
                        groups.push({
                            name: info.name
                        });
                    }
                }
            }

            if(fileLectureSheets === 0){
                debugLines.push(
                    file.name +
                    " → лист «Лекции» не найден"
                );
            }

        }catch(e){

            debugLines.push(
                file.name +
                " → ОШИБКА: " +
                (e.message || e)
            );
        }
    });


    groups.sort(function(a,b){
        return a.name.localeCompare(
            b.name,
            "ru",
            {
                numeric: true,
                sensitivity: "base"
            }
        );
    });


    debug(
        "Получено XLSX: " + files.length +
        "\nНайдено листов «Лекции»: " + lectureSheets +
        "\nНайдено групп: " + groups.length +
        "\n\n" +
        debugLines.join("\n")
    );


    if(!lectureSheets){

        setStatus(
            "Не найден лист «Лекции»",
            false,
            true
        );

        groupsEl.innerHTML =
            '<div class="empty">' +
            'Лист «Лекции» не найден' +
            '</div>';

        return;
    }


    if(!groups.length){

        setStatus(
            "Лист «Лекции» найден, но группы не найдены",
            false,
            true
        );

        groupsEl.innerHTML =
            '<div class="empty">' +
            'Группы не найдены' +
            '</div>';

        return;
    }


    setStatus(
        "Загружено групп: " + groups.length
    );


    if(
        !selectedGroup ||
        !groups.some(
            x =>
                normalize(x.name) ===
                normalize(selectedGroup)
        )
    ){
        selectedGroup = groups[0].name;
    }


    renderGroups();
    loadSelectedSchedule();
}


/* =========================================================
   ГРУППЫ
========================================================= */

function renderGroups(){

    groupsEl.innerHTML = "";

    if(!groups.length){

        groupsEl.innerHTML =
            '<div class="empty">Группы не найдены</div>';

        return;
    }

    for(const item of groups){

        const group = item.name;

        const button =
            document.createElement("button");

        button.textContent = group;

        if(
            selectedGroup &&
            normalize(group) ===
            normalize(selectedGroup)
        ){
            button.classList.add("selected");
        }

        button.onclick = function(){

            selectedGroup = group;

            renderGroups();
            loadSelectedSchedule();

        };

        groupsEl.appendChild(button);
    }
}


/* =========================================================
   ЗАГРУЗКА РАСПИСАНИЯ
========================================================= */

function loadSelectedSchedule(){

    schedule = [];

    if(!selectedGroup){
        renderSchedule();
        return;
    }


    for(const document of parsedDocuments){

        const info =
            document.groups.find(
                x =>
                    normalize(x.name) ===
                    normalize(selectedGroup)
            );

        if(!info){
            continue;
        }

        const data =
            parseGroupSchedule(
                document.sheet,
                info,
                document.fileIndex
            );

        schedule.push(...data);
    }


    /*
     * Сначала дата, потом время.
     */
    schedule.sort(function(a,b){

        const dateA = a.dateKey || 0;
        const dateB = b.dateKey || 0;

        if(dateA !== dateB){
            return dateA - dateB;
        }

        function timeValue(value){

            const v = clean(value)
                .replace(",", ".")
                .replace(":", ".");

            const m = v.match(
                /^(\d{1,2})\.(\d{2})$/
            );

            if(!m){
                return 9999;
            }

            return (
                Number(m[1]) * 60 +
                Number(m[2])
            );
        }

        return timeValue(a.time) - timeValue(b.time);
    });


    renderSchedule();
}


/* =========================================================
   ОТОБРАЖЕНИЕ
========================================================= */

function renderSchedule(){

    titleEl.textContent =
        selectedGroup
            ? "Расписание — " + selectedGroup
            : "Расписание";

    scheduleEl.innerHTML = "";

    if(!selectedGroup){

        scheduleEl.innerHTML =
            '<div class="empty">Выберите группу</div>';

        return;
    }

    if(!schedule.length){

        scheduleEl.innerHTML =
            '<div class="empty">' +
            'Для группы "' +
            selectedGroup +
            '" расписание не найдено.' +
            '</div>';

        return;
    }


    const days = [];

    for(const item of schedule){

        if(!days.includes(item.day)){
            days.push(item.day);
        }
    }


    for(const day of days){

        const dayItems =
            schedule.filter(
                x => x.day === day
            );

        const dayEl =
            document.createElement("div");

        dayEl.className = "day";


        const title =
            document.createElement("div");

        title.className = "day-title";
        title.textContent = day;

        dayEl.appendChild(title);


        for(const item of dayItems){

            const lesson =
                document.createElement("div");

            lesson.className = "lesson";


            const time =
                document.createElement("div");

            time.className = "lesson-time";
            time.textContent =
                item.time || "Время не указано";


            const name =
                document.createElement("div");

            name.className = "lesson-name";
            name.textContent = item.lesson;


            lesson.appendChild(time);
            lesson.appendChild(name);


            if(item.room){

                const room =
                    document.createElement("div");

                room.className =
                    "lesson-room";

                room.textContent =
                    "Кабинет: " + item.room;

                lesson.appendChild(room);
            }


            dayEl.appendChild(lesson);
        }


        scheduleEl.appendChild(dayEl);
    }
}


/* =========================================================
   ANDROID CALLBACK
========================================================= */

window.onNativeFiles = function(json){

    try{

        files = JSON.parse(json);

        syncRunning = false;

        if(!Array.isArray(files)){
            throw new Error(
                "Android вернул неправильные данные"
            );
        }

        if(!files.length){

            setStatus(
                "Архив получен, но XLSX-файлов нет",
                false,
                true
            );

            return;
        }

        setStatus(
            "Файлов получено: " +
            files.length +
            ". Анализирую Excel…",
            true
        );

        buildData();

    }catch(e){

        syncRunning = false;

        setStatus(
            "Ошибка обработки: " +
            (e.message || e),
            false,
            true
        );

        debug(
            "Ошибка обработки данных:\n" +
            (e.stack || e.message || e)
        );
    }
};


window.onNativeError = function(message){

    syncRunning = false;

    setStatus(
        message || "Ошибка обновления",
        false,
        true
    );

    debug(
        "Ошибка обновления:\n" +
        (message || "неизвестная ошибка")
    );
};


/* =========================================================
   АВТООБНОВЛЕНИЕ
========================================================= */

setInterval(
    function(){

        if(
            document.visibilityState ===
            "visible"
        ){
            syncNow();
        }

    },
    AUTO_UPDATE_MINUTES * 60 * 1000
);


document.addEventListener(
    "visibilitychange",
    function(){

        if(
            document.visibilityState ===
            "visible"
        ){
            syncNow();
        }

    }
);


/* =========================================================
   СТАРТ
========================================================= */

renderGroups();

setStatus(
    "Проверяю расписание…",
    true
);

syncNow();
</script>

</body>
</html>
