<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0d12">
<title>Расписание</title>

<script src="./xlsx.full.min.js"></script>

<style>
:root{
    --bg:#0b0d12;
    --card:#141821;
    --card2:#1a1f2a;
    --text:#f5f7fb;
    --muted:#9098a8;
    --accent:#8b7cff;
    --accent2:#aa9fff;
    --line:#272d38;
    --ok:#61d7a4;
    --error:#ff6b6b;
}

*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
    background:var(--bg);
    color:var(--text);
    font-family:Arial,sans-serif;
}

body{
    padding:18px;
}

h1{
    margin:0;
    font-size:26px;
}

.subtitle{
    color:var(--muted);
    margin-top:6px;
    font-size:14px;
}

.status{
    margin-top:16px;
    padding:12px 14px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:12px;
    font-size:14px;
}

.status.ok{
    border-color:var(--ok);
}

.status.error{
    border-color:var(--error);
}

.section{
    margin-top:18px;
}

.section-title{
    font-size:16px;
    font-weight:bold;
    margin-bottom:10px;
}

.groups{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:9px;
}

button{
    border:0;
    border-radius:11px;
    padding:12px 10px;
    background:var(--accent);
    color:white;
    font-size:14px;
    font-weight:bold;
    min-height:44px;
}

button:active{
    opacity:.75;
}

button.secondary{
    background:var(--card2);
    border:1px solid var(--line);
}

button.selected{
    background:var(--accent2);
}

.empty{
    padding:20px;
    text-align:center;
    color:var(--muted);
    background:var(--card);
    border-radius:12px;
    border:1px solid var(--line);
}

.day{
    margin-top:16px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    overflow:hidden;
}

.day-title{
    padding:13px 14px;
    background:var(--card2);
    font-weight:bold;
}

.lesson{
    padding:12px 14px;
    border-top:1px solid var(--line);
}

.lesson-time{
    font-weight:bold;
    color:var(--accent2);
}

.lesson-name{
    margin-top:4px;
    line-height:1.4;
}

.lesson-room{
    margin-top:5px;
    color:var(--muted);
    font-size:13px;
}

.toolbar{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-top:16px;
}

.debug{
    margin-top:16px;
    padding:12px;
    background:#080a0f;
    border:1px solid var(--line);
    border-radius:10px;
    color:var(--muted);
    font-size:12px;
    white-space:pre-wrap;
    word-break:break-word;
}

.hidden{
    display:none;
}
</style>
</head>

<body>

<h1>Расписание</h1>
<div class="subtitle">Учебное расписание</div>

<div id="status" class="status">
    Запуск…
</div>

<div class="toolbar">
    <button onclick="syncNow()">Обновить</button>
    <button class="secondary" onclick="openSource()">Источник</button>
</div>

<div class="section">
    <div class="section-title">Группы</div>
    <div id="groups" class="groups">
        <div class="empty">Загрузка групп…</div>
    </div>
</div>

<div class="section">
    <div class="section-title" id="scheduleTitle">
        Расписание
    </div>

    <div id="schedule">
        <div class="empty">
            Выберите группу
        </div>
    </div>
</div>

<div id="debug" class="debug hidden"></div>

<script>

const AUTO_UPDATE_MINUTES = 10;

let files = [];
let groups = [];
let selectedGroup = null;
let schedule = [];
let syncRunning = false;

const statusEl = document.getElementById("status");
const groupsEl = document.getElementById("groups");
const scheduleEl = document.getElementById("schedule");
const titleEl = document.getElementById("scheduleTitle");
const debugEl = document.getElementById("debug");


function setStatus(text, loading=false, error=false){

    statusEl.textContent = text;

    statusEl.classList.remove("ok");
    statusEl.classList.remove("error");

    if(error){
        statusEl.classList.add("error");
    }else if(!loading){
        statusEl.classList.add("ok");
    }
}


function debug(text){

    debugEl.classList.remove("hidden");
    debugEl.textContent = text;

}


function syncNow(){

    if(syncRunning){
        return;
    }

    syncRunning = true;

    setStatus("Загружаю расписание…",true);

    try{

        if(typeof Android === "undefined"){
            throw new Error("Android bridge недоступен");
        }

        Android.sync();

    }catch(e){

        syncRunning = false;

        setStatus(
            "Ошибка: " + (e.message || e),
            false,
            true
        );

    }

}


function openSource(){

    try{
        Android.openSource();
    }catch(e){
        alert("Не удалось открыть источник");
    }

}


/* =========================================================
   EXCEL
========================================================= */


function parseXlsx(file){

    try{

        if(typeof XLSX === "undefined"){
            throw new Error(
                "SheetJS не загружен"
            );
        }

        const binary = atob(file.data);

        const bytes = new Uint8Array(
            binary.length
        );

        for(let i=0;i<binary.length;i++){
            bytes[i] = binary.charCodeAt(i);
        }

        const workbook = XLSX.read(
            bytes,
            {
                type:"array",
                cellDates:true
            }
        );

        debug(
            "Файл: " + file.name +
            "\nЛисты: " +
            workbook.SheetNames.join(", ")
        );

        const result = [];

        for(const sheetName of workbook.SheetNames){

            const sheet = workbook.Sheets[sheetName];

            const rows = XLSX.utils.sheet_to_json(
                sheet,
                {
                    header:1,
                    defval:"",
                    raw:false
                }
            );

            result.push({
                name:sheetName,
                rows:rows,
                merges:sheet["!merges"] || []
            });

        }

        return result;

    }catch(e){

        console.error(e);

        throw new Error(
            "Ошибка Excel: " +
            (e.message || e)
        );

    }

}


/* =========================================================
   НОРМАЛИЗАЦИЯ
========================================================= */


function clean(value){

    if(value === null || value === undefined){
        return "";
    }

    return String(value)
        .replace(/\u00a0/g," ")
        .replace(/\s+/g," ")
        .trim();

}


function isGroupName(value){

    const v = clean(value);

    if(!v){
        return false;
    }

    if(v.toLowerCase() === "каб"){
        return false;
    }

    if(v.length > 30){
        return false;
    }

    /*
     * Группы в данном Excel имеют
     * цифры и/или буквенные обозначения.
     */

    return (
        /^\d{1,3}([.\-]\d+)?\s*/.test(v) ||
        /^\d{1,3}[А-ЯA-Za-z]/.test(v) ||
        /^\d{1,3}\s/.test(v)
    );

}


/* =========================================================
   ПОИСК ГРУПП
========================================================= */


function findGroupsFromRows(rows){

    const found = new Set();

    /*
     * В твоём Excel названия групп находятся
     * во второй строке.
     *
     * Там идут пары:
     *
     * каб | группа
     * каб | группа
     */

    for(let r=0;r<Math.min(rows.length,4);r++){

        const row = rows[r] || [];

        for(let c=0;c<row.length;c++){

            const value = clean(row[c]);

            if(!value){
                continue;
            }

            if(
                value.toLowerCase() === "каб"
            ){
                continue;
            }

            if(isGroupName(value)){
                found.add(value);
            }

        }

    }

    return [...found];

}


/* =========================================================
   ДАТА
========================================================= */


function isDay(value){

    const v = clean(value);

    return /^(ПН|ВТ|СР|ЧТ|ПТ|СБ|ВС)\s+\d{1,2}\.\d{1,2}/i.test(v);

}


/* =========================================================
   ПОЛУЧЕНИЕ ЗНАЧЕНИЯ MERGE
========================================================= */


function getCellValue(rows,row,col){

    if(!rows[row]){
        return "";
    }

    return clean(rows[row][col]);

}


/* =========================================================
   РАСПИСАНИЕ ГРУППЫ
========================================================= */


function parseGroup(rows,group){

    const result = [];

    if(!rows || !rows.length){
        return result;
    }

    /*
     * Ищем группу в первых строках.
     */

    let groupColumn = -1;

    for(let r=0;r<Math.min(rows.length,4);r++){

        const row = rows[r] || [];

        for(let c=0;c<row.length;c++){

            if(
                clean(row[c]).toLowerCase() ===
                group.toLowerCase()
            ){
                groupColumn = c;
                break;
            }

        }

        if(groupColumn !== -1){
            break;
        }

    }

    if(groupColumn === -1){
        return result;
    }

    /*
     * Обычно слева от группы находится
     * колонка "каб".
     */

    let roomColumn = groupColumn - 1;

    if(roomColumn < 0){
        roomColumn = groupColumn;
    }

    let currentDay = null;

    for(let r=0;r<rows.length;r++){

        const row = rows[r] || [];

        const first = clean(row[0]);

        if(isDay(first)){
            currentDay = first;
        }

        if(!currentDay){
            continue;
        }

        /*
         * В расписании время находится
         * в колонке B.
         */

        const time = clean(row[1]);

        let lesson = getCellValue(
            rows,
            r,
            groupColumn
        );

        let room = getCellValue(
            rows,
            r,
            roomColumn
        );

        /*
         * Иногда кабинет содержит текст,
         * а иногда время/служебные данные.
         */

        if(!lesson){
            continue;
        }

        if(
            lesson.toLowerCase() === "каб"
        ){
            continue;
        }

        result.push({
            day:currentDay,
            time:time,
            lesson:lesson,
            room:room
        });

    }

    return result;

}


/* =========================================================
   ПОИСК ДАННЫХ
========================================================= */


function buildSchedule(){

    groups = [];
    schedule = [];

    let parsedFiles = 0;
    let parsedSheets = 0;

    for(const file of files){

        try{

            const sheets = parseXlsx(file);

            parsedFiles++;

            for(const sheet of sheets){

                parsedSheets++;

                const found =
                    findGroupsFromRows(sheet.rows);

                for(const group of found){

                    if(!groups.includes(group)){
                        groups.push(group);
                    }

                }

            }

        }catch(e){

            console.error(
                "Ошибка файла",
                file.name,
                e
            );

            debug(
                "Файл: " + file.name +
                "\nОшибка: " +
                (e.message || e)
            );

        }

    }

    groups.sort((a,b)=>
        a.localeCompare(
            b,
            "ru",
            {
                numeric:true,
                sensitivity:"base"
            }
        )
    );

    if(!groups.length){

        setStatus(
            "Excel загружен, но группы не найдены",
            false,
            true
        );

        debug(
            "Получено файлов: " +
            files.length +
            "\nРаспознано файлов: " +
            parsedFiles +
            "\nРаспознано листов: " +
            parsedSheets +
            "\nXLSX: " +
            (typeof XLSX)
        );

    }else{

        setStatus(
            "Загружено групп: " + groups.length
        );

        if(
            !selectedGroup ||
            !groups.includes(selectedGroup)
        ){
            selectedGroup = groups[0];
        }

        renderGroups();

        loadSelectedSchedule();

    }

}


/* =========================================================
   ГРУППЫ
========================================================= */


function renderGroups(){

    groupsEl.innerHTML = "";

    if(!groups.length){

        groupsEl.innerHTML =
            '<div class="empty">Группы не найдены</div>';

        return;
    }

    for(const group of groups){

        const button =
            document.createElement("button");

        button.textContent = group;

        if(group === selectedGroup){
            button.classList.add("selected");
        }

        button.onclick = function(){

            selectedGroup = group;

            renderGroups();
            loadSelectedSchedule();

        };

        groupsEl.appendChild(button);

    }

}


/* =========================================================
   ЗАГРУЗКА РАСПИСАНИЯ
========================================================= */


function loadSelectedSchedule(){

    schedule = [];

    for(const file of files){

        try{

            const sheets = parseXlsx(file);

            for(const sheet of sheets){

                const data =
                    parseGroup(
                        sheet.rows,
                        selectedGroup
                    );

                schedule.push(...data);

            }

        }catch(e){

            console.error(e);

        }

    }

    renderSchedule();

}


/* =========================================================
   ОТОБРАЖЕНИЕ
========================================================= */


function renderSchedule(){

    titleEl.textContent =
        selectedGroup
            ? "Расписание — " + selectedGroup
            : "Расписание";

    scheduleEl.innerHTML = "";

    if(!selectedGroup){

        scheduleEl.innerHTML =
            '<div class="empty">Выберите группу</div>';

        return;

    }

    if(!schedule.length){

        scheduleEl.innerHTML =
            '<div class="empty">' +
            'Для группы "' +
            selectedGroup +
            '" расписание не найдено.' +
            '</div>';

        return;

    }

    const days = [];

    for(const item of schedule){

        if(!days.includes(item.day)){
            days.push(item.day);
        }

    }

    for(const day of days){

        const dayItems =
            schedule.filter(
                x => x.day === day
            );

        const dayEl =
            document.createElement("div");

        dayEl.className = "day";

        const title =
            document.createElement("div");

        title.className = "day-title";
        title.textContent = day;

        dayEl.appendChild(title);

        for(const item of dayItems){

            const lesson =
                document.createElement("div");

            lesson.className = "lesson";

            const time =
                document.createElement("div");

            time.className = "lesson-time";
            time.textContent =
                item.time || "Время не указано";

            const name =
                document.createElement("div");

            name.className = "lesson-name";
            name.textContent = item.lesson;

            lesson.appendChild(time);
            lesson.appendChild(name);

            if(item.room){

                const room =
                    document.createElement("div");

                room.className =
                    "lesson-room";

                room.textContent =
                    "Кабинет: " + item.room;

                lesson.appendChild(room);

            }

            dayEl.appendChild(lesson);

        }

        scheduleEl.appendChild(dayEl);

    }

}


/* =========================================================
   ANDROID CALLBACK
========================================================= */


window.onNativeFiles = function(json){

    try{

        files = JSON.parse(json);

        syncRunning = false;

        if(!Array.isArray(files)){
            throw new Error(
                "Android вернул неправильные данные"
            );
        }

        setStatus(
            "Файлов получено: " +
            files.length +
            ". Анализирую Excel…",
            true
        );

        if(!files.length){

            setStatus(
                "Архив получен, но XLSX-файлов нет",
                false,
                true
            );

            return;
        }

        buildSchedule();

    }catch(e){

        syncRunning = false;

        setStatus(
            "Ошибка обработки: " +
            (e.message || e),
            false,
            true
        );

        debug(
            "Ошибка обработки данных:\n" +
            (e.stack || e.message || e)
        );

    }

};


window.onNativeError = function(message){

    syncRunning = false;

    setStatus(
        message || "Ошибка обновления",
        false,
        true
    );

};


/* =========================================================
   АВТООБНОВЛЕНИЕ
========================================================= */


setInterval(
    function(){

        if(
            document.visibilityState ===
            "visible"
        ){
            syncNow();
        }

    },
    AUTO_UPDATE_MINUTES * 60 * 1000
);


document.addEventListener(
    "visibilitychange",
    function(){

        if(
            document.visibilityState ===
            "visible"
        ){
            syncNow();
        }

    }
);


/* =========================================================
   СТАРТ
========================================================= */


renderGroups();

setStatus(
    "Проверяю расписание…",
    true
);

syncNow();

</script>

</body>
</html>
